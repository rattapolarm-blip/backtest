<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backtest Playbook FULL</title>

<style>
:root{
 --bg:#0b0b0b;--card:#141414;--line:#2a2a2a;
 --green:#22c55e;--yellow:#ca8a04;--red:#dc2626;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#eee;font-family:Arial}
.wrap{
 padding:14px;
 transform:scale(0.8);
 transform-origin:top center;
}
h2{font-size:26px} h3{font-size:20px;margin-top:18px}
.card{
 background:var(--card);
 border:2px solid var(--line);
 border-radius:16px;
 padding:16px;
 margin-bottom:16px;
}
select,textarea,button{
 width:100%;margin-top:10px;padding:16px;
 background:#0f0f0f;color:#fff;
 border:2px solid #333;border-radius:14px;
 font-size:18px;
}
textarea{min-height:110px}
button.main{background:var(--green);color:#000;font-weight:bold}
button.warn{background:var(--yellow);color:#000}
button.danger{background:var(--red);color:#fff}
label{
 display:flex;align-items:center;gap:14px;
 padding:12px;margin:8px 0;
 background:#101010;border:2px solid #333;border-radius:12px;
 font-size:18px;
}
input[type=checkbox]{width:28px;height:28px;accent-color:var(--green)}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
th,td{border:2px solid #333;padding:10px}
th{background:#222}
.ok{background:#1f4f2f}.mid{background:#5a4a1d}.bad{background:#5b1d1d}
@media(min-width:900px){.wrap{max-width:900px;margin:auto}}
</style>
</head>

<body>
<div class="wrap">

<h2>📘 Backtest Playbook (FULL)</h2>

<!-- Session -->
<div class="card">
<h3>Session / Grade / Result</h3>
<select id="session"><option>Asia</option><option>London</option><option>New York</option></select>
<select id="grade">
 <option>A+</option><option>A</option>
 <option>B+</option><option>B</option>
 <option>C+</option><option>C</option>
</select>
<select id="result"><option>Win</option><option>Loss</option></select>
</div>

<!-- STO -->
<div class="card">
<h3>📊 STO</h3>
<select id="stoM5"><option>None</option><option>OVB</option><option>OVS</option></select>
<select id="stoM15"><option>None</option><option>OVB</option><option>OVS</option></select>
</div>

<!-- Structure -->
<div class="card">
<h3>🏗 Structure / Zone</h3>
<label><input type="checkbox" value="Sweep"> Sweep</label>
<label><input type="checkbox" value="BOS"> BOS</label>
<label><input type="checkbox" value="Equal High"> Equal High</label>
<label><input type="checkbox" value="Equal Low"> Equal Low</label>
<label><input type="checkbox" value="Asia High"> Asia High</label>
<label><input type="checkbox" value="Asia Low"> Asia Low</label>
<label><input type="checkbox" value="Prev Day High"> Prev Day High</label>
<label><input type="checkbox" value="Prev Day Low"> Prev Day Low</label>
<label><input type="checkbox" value="Higher High"> Higher High</label>
<label><input type="checkbox" value="Higher Low"> Higher Low</label>
<label><input type="checkbox" value="Lower High"> Lower High</label>
<label><input type="checkbox" value="Lower Low"> Lower Low</label>
</div>

<!-- Pattern -->
<div class="card">
<h3>📐 Zone / Pattern</h3>
<label><input type="checkbox" value="FVG"> FVG</label>
<label><input type="checkbox" value="Order Block"> Order Block</label>
<label><input type="checkbox" value="Bullish Engulfing"> Bullish Engulfing</label>
<label><input type="checkbox" value="Bearish Engulfing"> Bearish Engulfing</label>
<label><input type="checkbox" value="Trendline"> Trendline</label>
<label><input type="checkbox" value="Fibonacci"> Fibonacci Zone</label>
</div>

<!-- Risk -->
<div class="card">
<h3>📈 Trend / Risk</h3>
<label><input type="checkbox" value="EMA200 M15"> EMA200 เทรน M15</label>
<label><input type="checkbox" value="EMA200 H1"> EMA200 เทรน H1</label>
<label><input type="checkbox" value="RR คุ้ม"> RR คุ้ม</label>
<label><input type="checkbox" value="ใกล้ Supply/EMA"> ใกล้ Supply / EMA</label>
</div>

<!-- Mindset -->
<div class="card">
<h3>🧠 Mindset</h3>
<label><input type="checkbox" value="ใจนิ่ง"> ใจนิ่ง</label>
<label><input type="checkbox" value="ทำตามแผน"> ทำตามแผน</label>
<label><input type="checkbox" value="FOMO"> FOMO ❌</label>
<label><input type="checkbox" value="Revenge"> Revenge ❌</label>
</div>

<!-- Note -->
<div class="card">
<h3>📝 หมายเหตุ (บังคับ)</h3>
<textarea id="note" placeholder="ตามแผน / หลุดเทรนด์ / FOMO / สวนเทรนด์"></textarea>
</div>

<button class="main" onclick="saveTrade()">บันทึกไม้</button>
<button class="warn" onclick="exportCSV()">📤 Export Excel</button>

<div class="card" id="summary"></div>
<div class="card" id="combo"></div>
<div class="card" id="tradeTable"></div>

<button class="danger" onclick="clearAll()">🧹 ล้างข้อมูลทั้งหมด</button>

</div>

<script>
const KEY="PLAYBOOK_FULL";

function load(){return JSON.parse(localStorage.getItem(KEY)||"[]")}
function save(d){localStorage.setItem(KEY,JSON.stringify(d))}

function saveTrade(){
 if(!note.value.trim()){alert("ต้องใส่หมายเหตุ");return;}
 const tags=[...document.querySelectorAll("input[type=checkbox]:checked")].map(x=>x.value);
 const d=load();
 d.push({
  date:new Date().toISOString().slice(0,10),
  session:session.value,
  grade:grade.value,
  result:result.value,
  stoM5:stoM5.value,
  stoM15:stoM15.value,
  tags,note:note.value
 });
 save(d);
 document.querySelectorAll("input[type=checkbox]").forEach(x=>x.checked=false);
 note.value="";
 render();
}

function render(){
 const d=load();
 if(!d.length){summary.innerHTML="ยังไม่มีข้อมูล";combo.innerHTML=tradeTable.innerHTML="";return;}
 const win=d.filter(x=>x.result==="Win").length;
 summary.innerHTML=`🔥 Win ${win} | Loss ${d.length-win} | WinRate ${(win/d.length*100).toFixed(1)}%`;
 renderCombo(d); renderTrades(d);
}

function renderCombo(d){
 const m={};
 d.forEach(t=>{
  const k=[t.grade,t.tags.includes("Sweep")?"Sweep":"No Sweep",t.note].join(" | ");
  if(!m[k])m[k]={w:0,l:0};
  t.result==="Win"?m[k].w++:m[k].l++;
 });
 let h="<h3>🔥 Top Combo (รวมหมายเหตุ)</h3><table><tr><th>Combo</th><th>WR</th><th>W/L</th></tr>";
 Object.entries(m).forEach(([k,v])=>{
  const wr=v.w/(v.w+v.l||1);
  h+=`<tr class="${wr>=0.7?'ok':wr>=0.4?'mid':'bad'}"><td>${k}</td><td>${(wr*100).toFixed(1)}%</td><td>${v.w}/${v.l}</td></tr>`;
 });
 combo.innerHTML=h+"</table>";
}

function renderTrades(d){
 let h="<h3>📋 สรุปทุกไม้</h3><table><tr><th>Date</th><th>Session</th><th>Grade</th><th>Result</th><th>Tags</th><th>Note</th></tr>";
 d.forEach(t=>{
  h+=`<tr><td>${t.date}</td><td>${t.session}</td><td>${t.grade}</td><td>${t.result}</td><td>${t.tags.join(", ")}</td><td>${t.note}</td></tr>`;
 });
 tradeTable.innerHTML=h+"</table>";
}

function exportCSV(){
 const d=load(); if(!d.length)return;
 let csv="Date,Session,Grade,Result,Tags,Note\n";
 d.forEach(t=>csv+=`${t.date},${t.session},${t.grade},${t.result},"${t.tags.join("|")}","${t.note}"\n`);
 const a=document.createElement("a");
 a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv"}));
 a.download="Backtest_Playbook.csv";a.click();
}

function clearAll(){if(confirm("ล้างทั้งหมด?")){localStorage.clear();render();}}

render();
</script>

</body>
</html>
