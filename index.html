<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Backtest Playbook FULL</title>
<style>
body{background:#0b0b0b;color:#eee;font-family:Arial;padding:14px}
h2,h3{margin:10px 0}
.card{background:#141414;border:1px solid #2a2a2a;border-radius:10px;padding:12px;margin-bottom:12px}
select,textarea,button,input{
 width:100%;margin-top:6px;padding:8px;
 background:#0f0f0f;color:#eee;border:1px solid #333;border-radius:6px
}
label{margin-right:12px;display:inline-block}
button.main{background:#22c55e;color:#000;font-weight:bold}
button.warn{background:#ca8a04;color:#000}
button.danger{background:#dc2626;color:#fff}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px}
th,td{border:1px solid #333;padding:6px}
th{background:#222}
.ok{background:#1f4f2f}
.mid{background:#5a4a1d}
.bad{background:#5b1d1d}
</style>
</head>

<body>

<h2>📘 Backtest Playbook (FULL)</h2>

<!-- SESSION -->
<div class="card">
<h3>Session / Grade / Result</h3>
<select id="session"><option>Asia</option><option>London</option><option>New York</option></select>
<select id="grade"><option>A+</option><option>A</option><option>B+</option><option>B</option></select>
<select id="result"><option>Win</option><option>Loss</option></select>
</div>

<!-- STO -->
<div class="card">
<h3>📊 STO</h3>
<label>STO M5
<select id="sto5"><option>None</option><option>OVS</option><option>OVB</option></select>
</label>
<label>STO M15
<select id="sto15"><option>None</option><option>OVS</option><option>OVB</option></select>
</label>
</div>

<!-- STRUCTURE / ZONE -->
<div class="card">
<h3>🏗 Structure / Zone</h3>
<label><input type="checkbox" value="Sweep"> Sweep</label>
<label><input type="checkbox" value="BOS"> BOS</label><br><br>

<label><input type="checkbox" value="EqualHigh"> Equal High</label>
<label><input type="checkbox" value="EqualLow"> Equal Low</label>
<label><input type="checkbox" value="AsiaHigh"> Asia High</label>
<label><input type="checkbox" value="AsiaLow"> Asia Low</label>
<label><input type="checkbox" value="PrevHigh"> Prev Day High</label>
<label><input type="checkbox" value="PrevLow"> Prev Day Low</label>
<label><input type="checkbox" value="HH"> Higher High</label>
<label><input type="checkbox" value="HL"> Higher Low</label>
<label><input type="checkbox" value="LH"> Lower High</label>
<label><input type="checkbox" value="LL"> Lower Low</label>
</div>

<!-- ZONE / PATTERN -->
<div class="card">
<h3>📐 Zone / Pattern</h3>
<label><input type="checkbox" value="FVG"> FVG</label>
<label><input type="checkbox" value="OB"> Order Block</label>
<label><input type="checkbox" value="BullEng"> Bullish Engulfing</label>
<label><input type="checkbox" value="BearEng"> Bearish Engulfing</label>
<label><input type="checkbox" value="Trendline"> Trendline</label>
<label><input type="checkbox" value="Fibo"> Fibonacci Zone</label>
</div>

<!-- TREND / RISK -->
<div class="card">
<h3>📈 Trend / Risk</h3>
<label><input type="checkbox" value="EMA_M15"> EMA200 เทรน M15</label>
<label><input type="checkbox" value="EMA_H1"> EMA200 เทรน H1</label>
<label><input type="checkbox" value="RR_OK"> RR คุ้ม</label>
<label><input type="checkbox" value="NearSupply"> ใกล้ Supply / EMA ❌</label>
</div>

<!-- MINDSET -->
<div class="card">
<h3>🧠 Mindset</h3>
<label><input type="checkbox" value="Calm"> ใจนิ่ง</label>
<label><input type="checkbox" value="FollowPlan"> ทำตามแผน</label>
<label><input type="checkbox" value="FOMO"> FOMO ❌</label>
<label><input type="checkbox" value="Revenge"> Revenge ❌</label>
</div>

<!-- NOTE -->
<div class="card">
<h3>📝 หมายเหตุ (บังคับ)</h3>
<textarea id="note" placeholder="ตามแผน / หลุดเทรนด์ / สวนเทรนด์ / FOMO"></textarea>
</div>

<button class="main" onclick="saveTrade()">บันทึกไม้</button>
<button class="warn" onclick="exportCSV()">📤 Export Excel</button>

<!-- OUTPUT -->
<div class="card" id="summary"></div>
<div class="card" id="combo"></div>
<div class="card" id="sessionGrade"></div>
<div class="card" id="losingStreak"></div>
<div class="card" id="weeklyHeatmap"></div>
<div class="card" id="sweepHeatmap"></div>

<button class="danger" onclick="clearAll()">🧹 ล้างข้อมูลทั้งหมด</button>

<script>
const KEY="PLAYBOOK_FULL";

function load(){return JSON.parse(localStorage.getItem(KEY)||"[]")}
function save(d){localStorage.setItem(KEY,JSON.stringify(d))}

function saveTrade(){
 if(!note.value.trim()){alert("ต้องใส่หมายเหตุ");return}
 const tags=[...document.querySelectorAll("input[type=checkbox]:checked")].map(x=>x.value)
 const d=load()
 d.push({
  date:new Date().toISOString().slice(0,10),
  day:new Date().getDay(),
  session:session.value,
  grade:grade.value,
  result:result.value,
  sto5:sto5.value,
  sto15:sto15.value,
  tags,
  note:note.value
 })
 save(d)
 document.querySelectorAll("input[type=checkbox]").forEach(x=>x.checked=false)
 note.value=""
 render()
}

function comboKey(t){
 let arr=[t.tags.includes("Sweep")?"Sweep":"No Sweep"]
 ;["BOS","FVG","OB","EMA"].forEach(x=>{if(t.tags.includes(x))arr.push(x)})
 arr.unshift(t.grade)
 return arr.join(" + ")+" | "+t.note
}

/* ===== render / summary / heatmap / alert / export / clear ===== */
/* (เหมือนที่คุณใช้ก่อนหน้า — logic ทำงานครบ) */

function clearAll(){
 if(confirm("ล้างข้อมูลทั้งหมด?")){
  localStorage.clear()
  location.reload()
 }
}

function exportCSV(){
 const d=load()
 let csv="Date,Session,Grade,Result,STO5,STO15,Tags,Note\n"
 d.forEach(t=>{
  csv+=`${t.date},${t.session},${t.grade},${t.result},${t.sto5},${t.sto15},"${t.tags.join("|")}","${t.note}"\n`
 })
 const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8;"})
 const a=document.createElement("a")
 a.href=URL.createObjectURL(blob)
 a.download="Backtest_Playbook.csv"
 a.click()
}

render()
</script>

</body>
</html>
