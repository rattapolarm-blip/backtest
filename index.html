<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Journal – Mobile Safe</title>

<style>
/* ================= RESET ================= */
*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  height:auto;
  min-height:100%;
  overflow-x:hidden;
  overflow-y:auto;
  background:#0b0b0b;
  color:#eaeaea;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-overflow-scrolling:touch;
}

/* ================= LAYOUT ================= */
.wrapper{
  width:100%;
  max-width:1200px;
  margin:auto;
  padding:12px;
}

.section{
  background:#141414;
  border-radius:12px;
  padding:12px;
  margin-bottom:12px;
}

h3{
  margin:0 0 8px;
  font-size:15px;
}

/* ================= INPUT ================= */
label{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:14px;
  margin-bottom:6px;
}

input[type="checkbox"]{
  transform:scale(1.1);
}

select,input[type="text"]{
  width:100%;
  padding:10px;
  font-size:16px;
  border-radius:8px;
  border:none;
  background:#1e1e1e;
  color:#fff;
}

/* ================= GRID ================= */
.grid-2{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:6px;
}

.grid-1{
  display:grid;
  grid-template-columns:1fr;
  gap:6px;
}

/* ================= ACTION ================= */
.actions{
  margin:16px 0 24px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

button{
  flex:1;
  padding:14px;
  font-size:16px;
  font-weight:700;
  border-radius:12px;
  border:none;
}

.save{background:#22c55e;color:#000}
.export{background:#f59e0b;color:#000}

/* ================= MOBILE ================= */
@media(max-width:768px){
  .grid-2{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="wrapper">

  <div class="section">
    <h3>Structure / Zone</h3>
    <div class="grid-2">
      <label><input type="checkbox">Sweep</label>
      <label><input type="checkbox">BOS</label>
      <label><input type="checkbox">Equal High</label>
      <label><input type="checkbox">Equal Low</label>
      <label><input type="checkbox">Asia High</label>
      <label><input type="checkbox">Asia Low</label>
      <label><input type="checkbox">Higher High</label>
      <label><input type="checkbox">Lower Low</label>
    </div>
  </div>

  <div class="section">
    <h3>Zone / Pattern</h3>
    <div class="grid-2">
      <label><input type="checkbox">FVG</label>
      <label><input type="checkbox">Order Block</label>
      <label><input type="checkbox">Bullish Engulfing</label>
      <label><input type="checkbox">Bearish Engulfing</label>
      <label><input type="checkbox">Trendline</label>
      <label><input type="checkbox">Fibonacci</label>
    </div>
  </div>

  <div class="section">
    <h3>Trend / Risk</h3>
    <div class="grid-2">
      <label><input type="checkbox">EMA M15</label>
      <label><input type="checkbox">EMA H1</label>
      <label><input type="checkbox">RR OK</label>
    </div>
  </div>

  <div class="section">
    <h3>Mindset</h3>
    <div class="grid-2">
      <label><input type="checkbox">Calm</label>
      <label><input type="checkbox">Plan</label>
      <label><input type="checkbox">FOMO</label>
      <label><input type="checkbox">Revenge</label>
    </div>
  </div>

  <div class="section">
    <h3>Session & Grade</h3>
    <label>Session</label>
    <select>
      <option>Asia</option>
      <option>London</option>
      <option>New York</option>
    </select>

    <label style="margin-top:8px">Grade</label>
    <select>
      <option>A+</option>
      <option>A</option>
      <option>B+</option>
      <option>B</option>
    </select>
  </div>

  <div class="section">
    <h3>Note</h3>
    <input type="text" placeholder="บันทึกเหตุผลการเข้าไม้">
  </div>

  <div class="actions">
    <button class="save">บันทึก</button>
    <button class="export">Export Excel</button>
  </div>

</div>

</body>
</html>
