<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Backtest Playbook FULL</title>

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<style>
:root{
 --bg:#0b0b0b;
 --card:#141414;
 --line:#2a2a2a;
 --green:#22c55e;
 --yellow:#ca8a04;
 --red:#dc2626;
}
*{box-sizing:border-box}
body{
 background:var(--bg);
 color:#eee;
 font-family:Arial,Helvetica,sans-serif;
 margin:0;
 padding:12px;
}
h2{font-size:22px;margin:10px 0}
h3{font-size:18px;margin:10px 0}

.card{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:16px;
 padding:14px;
 margin-bottom:14px;
}

select,textarea,button{
 width:100%;
 margin-top:8px;
 padding:14px;
 font-size:16px;
 background:#0f0f0f;
 color:#eee;
 border:1px solid #333;
 border-radius:10px;
}
textarea{min-height:90px}

label{
 display:inline-flex;
 align-items:center;
 gap:10px;
 margin:8px 14px 8px 0;
 font-size:16px;
}
input[type=checkbox]{
 width:26px;
 height:26px;
 accent-color:var(--green);
}

button.main{background:var(--green);color:#000;font-weight:bold}
button.warn{background:var(--yellow);color:#000;font-weight:bold}
button.danger{background:var(--red);color:#fff;font-weight:bold}

table{
 width:100%;
 border-collapse:collapse;
 margin-top:10px;
 font-size:14px;
}
th,td{
 border:1px solid #333;
 padding:8px;
 text-align:left;
}
th{background:#222}
.ok{background:#1f4f2f}
.mid{background:#5a4a1d}
.bad{background:#5b1d1d}

@media (max-width:768px){
 body{transform:scale(1.12);transform-origin:top center}
 h2{font-size:26px}
 h3{font-size:22px}
 label{font-size:20px;gap:14px;margin:12px 0}
 input[type=checkbox]{width:34px;height:34px}
 select,textarea,button{font-size:20px;padding:18px}
 .card{padding:20px;border-radius:18px}
 table{font-size:16px}
 th,td{padding:12px}
}
</style>
</head>

<body>

<h2>📘 Backtest Playbook (FULL)</h2>

<div class="card">
<h3>Session / Grade / Result</h3>
<select id="session">
 <option>Asia</option>
 <option>London</option>
 <option>New York</option>
</select>

<select id="grade">
 <option>A+</option><option>A</option>
 <option>B+</option><option>B</option>
 <option>C+</option><option>C</option>
</select>

<select id="result">
 <option>Win</option>
 <option>Loss</option>
</select>
</div>

<div class="card">
<h3>📊 STO</h3>
<select id="sto5">
 <option>None</option>
 <option>OVB</option>
 <option>OVS</option>
</select>
<select id="sto15">
 <option>None</option>
 <option>OVB</option>
 <option>OVS</option>
</select>
</div>

<div class="card">
<h3>🏗 Structure / Liquidity</h3>
<label><input type="checkbox" value="Sweep">Sweep</label>
<label><input type="checkbox" value="BOS">BOS</label>
<label><input type="checkbox" value="Liquidity">Liquidity (EQH / EQL / Asia)</label>
</div>

<div class="card">
<h3>📐 Zone / Pattern</h3>
<label><input type="checkbox" value="FVG">FVG</label>
<label><input type="checkbox" value="Order Block">Order Block</label>
<label><input type="checkbox" value="Bullish Engulfing">Bullish Engulfing</label>
<label><input type="checkbox" value="Bearish Engulfing">Bearish Engulfing</label>
<label><input type="checkbox" value="Premium Discount">Premium / Discount (50%)</label>
</div>

<div class="card">
<h3>📉 Trend / Risk</h3>
<label><input type="checkbox" value="EMA M15">EMA200 M15</label>
<label><input type="checkbox" value="EMA H1">EMA200 H1</label>
<label><input type="checkbox" value="RR OK">RR คุ้ม</label>
<label><input type="checkbox" value="Near Supply EMA">❌ ใกล้ Supply / EMA</label>
</div>

<div class="card">
<h3>🧠 Mindset</h3>
<label><input type="checkbox" value="Calm">ใจนิ่ง</label>
<label><input type="checkbox" value="Plan">ทำตามแผน</label>
<label><input type="checkbox" value="FOMO">FOMO ❌</label>
<label><input type="checkbox" value="Revenge">Revenge ❌</label>
</div>

<div class="card">
<h3>📝 หมายเหตุ (บังคับ)</h3>
<textarea id="note" placeholder="เช่น ตามแผน / หลุดเทรนด์ / สวนเทรนด์ / FOMO"></textarea>
</div>

<button class="main" onclick="saveTrade()">บันทึกไม้</button>
<button class="warn" onclick="exportCSV()">📤 Export Excel</button>

<div class="card" id="summary"></div>
<div class="card" id="sessionGrade"></div>
<div class="card" id="losingStreak"></div>
<div class="card" id="weeklyHeatmap"></div>
<div class="card" id="sweepHeatmap"></div>
<div class="card" id="combo"></div>
<div class="card" id="tradeTable"></div>

<button class="danger" onclick="clearAll()">🧹 ล้างข้อมูลทั้งหมด</button>

<script>
/* SCRIPT เหมือนเดิม ใช้ได้ 100% ไม่ต้องแก้ */
</script>

</body>
</html>
