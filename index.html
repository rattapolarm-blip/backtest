<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backtest Playbook FULL</title>

<style>
:root{
 --bg:#0b0b0b; --card:#141414; --line:#2a2a2a;
 --green:#22c55e; --yellow:#ca8a04; --red:#dc2626;
}
*{box-sizing:border-box}
body{
 background:var(--bg); color:#eee; font-family:Arial;
 margin:0; padding:12px;
}

/* ---------- MOBILE SCALE ---------- */
@media(max-width:768px){
 body{font-size:15px}
 input[type=checkbox]{width:26px;height:26px}
 select,textarea,button{padding:14px;font-size:16px}
}

/* ---------- UI ---------- */
.card{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:14px;
 padding:14px;
 margin-bottom:14px;
}
h2{font-size:22px;margin:6px 0}
h3{font-size:18px;margin:8px 0}
label{display:inline-flex;align-items:center;gap:8px;margin:6px 10px 6px 0}

select,textarea,button{
 width:100%; margin-top:8px;
 background:#0f0f0f; color:#eee;
 border:1px solid #333; border-radius:8px;
}
textarea{min-height:90px}

button.main{background:var(--green);color:#000;font-weight:bold}
button.warn{background:var(--yellow);color:#000}
button.danger{background:var(--red);color:#fff}

/* ---------- TABLE ---------- */
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}
th,td{border:1px solid #333;padding:8px;text-align:left}
th{background:#222}

.ok{background:#1f4f2f}
.mid{background:#5a4a1d}
.bad{background:#5b1d1d}

/* TAG CELL */
.tag-cell{
 white-space:nowrap;
 max-width:260px;
 overflow-x:auto;
}
</style>
</head>

<body>

<h2>📘 Backtest Playbook FULL</h2>

<div class="card">
<h3>Session / Grade / Result</h3>
<select id="session"><option>Asia</option><option>London</option><option>New York</option></select>
<select id="grade">
<option>A+</option><option>A</option><option>B+</option><option>B</option>
<option>C+</option><option>C</option>
</select>
<select id="result"><option>Win</option><option>Loss</option></select>
</div>

<div class="card">
<h3>Structure / Pattern</h3>
<label><input type="checkbox" value="Sweep">Sweep</label>
<label><input type="checkbox" value="BOS">BOS</label>
<label><input type="checkbox" value="FVG">FVG</label>
<label><input type="checkbox" value="OB">Order Block</label>
<label><input type="checkbox" value="EMA M15">EMA M15</label>
<label><input type="checkbox" value="EMA H1">EMA H1</label>
</div>

<div class="card">
<h3>📝 หมายเหตุ (บังคับ)</h3>
<textarea id="note" placeholder="ตามแผน / FOMO / หลุดโครง / สวนเทรนด์"></textarea>
</div>

<button class="main" onclick="saveTrade()">บันทึกไม้</button>
<button class="warn" onclick="exportCSV()">📤 Export Excel</button>

<div class="card" id="summary"></div>
<div class="card" id="winTable"></div>
<div class="card" id="lossTable"></div>
<div class="card" id="combo"></div>
<div class="card" id="sessionGrade"></div>

<button class="danger" onclick="clearAll()">🧹 ล้างข้อมูลทั้งหมด</button>

<script>
const KEY="PLAYBOOK_FULL";
const load=()=>JSON.parse(localStorage.getItem(KEY)||"[]");
const save=d=>localStorage.setItem(KEY,JSON.stringify(d));

function saveTrade(){
 if(!note.value.trim()){alert("ต้องใส่หมายเหตุ");return;}
 const tags=[...document.querySelectorAll("input[type=checkbox]:checked")].map(x=>x.value);
 const d=load();
 d.push({
  date:new Date().toISOString().slice(0,10),
  session:session.value,
  grade:grade.value,
  result:result.value,
  tags,
  note:note.value
 });
 save(d);
 document.querySelectorAll("input[type=checkbox]").forEach(x=>x.checked=false);
 note.value="";
 render();
}

function render(){
 const d=load();
 if(!d.length){summary.innerHTML="ยังไม่มีข้อมูล";return;}

 const win=d.filter(x=>x.result==="Win");
 const loss=d.filter(x=>x.result==="Loss");
 const wr=(win.length+d.length?win.length/d.length*100:0).toFixed(1);

 summary.innerHTML=`🔥 Win ${win.length} | Loss ${loss.length} | WinRate ${wr}%`;

 renderTable(win,"📈 ไม้ชนะ",winTable);
 renderTable(loss,"📉 ไม้แพ้",lossTable);
}

function renderTable(arr,title,el){
 let h=`<h3>${title}</h3><table><tr>
 <th>Date</th><th>Session</th><th>Grade</th><th>Tags</th><th>Note</th></tr>`;
 arr.forEach(t=>{
  h+=`<tr>
   <td>${t.date}</td>
   <td>${t.session}</td>
   <td>${t.grade}</td>
   <td class="tag-cell">${t.tags.join(" | ")}</td>
   <td>${t.note}</td>
  </tr>`;
 });
 h+="</table>";
 el.innerHTML=h;
}

function exportCSV(){
 const d=load(); if(!d.length)return;
 let csv="Date,Session,Grade,Result,Tags,Note\n";
 d.forEach(t=>{
  csv+=`${t.date},${t.session},${t.grade},${t.result},"${t.tags.join("|")}","${t.note}"\n`;
 });
 const blob=new Blob(["\ufeff"+csv],{type:"text/csv"});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download="Backtest_Playbook.csv";
 a.click();
}

function clearAll(){
 if(confirm("ล้างข้อมูลทั้งหมด?")){
  localStorage.clear();
  render();
 }
}
render();
</script>
</body>
</html>
