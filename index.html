<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Backtest Playbook (FULL)</title>

<style>
:root{
  --bg:#0b0b0b;
  --card:#141414;
  --line:#2a2a2a;
  --green:#22c55e;
  --yellow:#ca8a04;
  --red:#dc2626;
}

*{box-sizing:border-box}

body{
  margin:0;
  padding:10px;
  background:var(--bg);
  color:#eee;
  font-family:Arial, sans-serif;
  font-size:15px;
}

/* ---------- CARD ---------- */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px;
  margin-bottom:14px;
}

/* ---------- HEAD ---------- */
h2{font-size:22px;margin:6px 0}
h3{font-size:18px;margin:10px 0}

/* ---------- INPUT ---------- */
select,textarea,button{
  width:100%;
  margin-top:8px;
  padding:14px;
  font-size:16px;
  background:#0f0f0f;
  color:#eee;
  border:1px solid #333;
  border-radius:10px;
}

textarea{min-height:90px}

/* ---------- CHECKBOX (Mobile Friendly) ---------- */
.checkbox-group{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

label{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:15px;
}

input[type=checkbox]{
  width:24px;
  height:24px;
  accent-color:var(--green);
}

/* ---------- BUTTON ---------- */
button.main{
  background:var(--green);
  color:#000;
  font-weight:bold;
}
button.warn{background:var(--yellow);color:#000}
button.danger{background:var(--red);color:#fff}

/* ---------- TABLE ---------- */
.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
  font-size:14px;
  min-width:520px;
}

th,td{
  border:1px solid #333;
  padding:8px;
  text-align:left;
}

th{background:#222}

.ok{background:#1f4f2f}
.mid{background:#5a4a1d}
.bad{background:#5b1d1d}

/* ---------- DESKTOP ONLY LAYOUT ---------- */
@media(min-width:900px){
  .row{
    display:flex;
    gap:12px;
  }
  .row>.card{flex:1}
}
</style>
</head>

<body>

<h2>📘 Backtest Playbook (FULL)</h2>

<!-- INPUT -->
<div class="card">
<h3>Session / Grade / Result</h3>
<select id="session">
  <option>Asia</option><option>London</option><option>New York</option>
</select>
<select id="grade">
  <option>A+</option><option>A</option><option>B+</option><option>B</option>
  <option>C+</option><option>C</option>
</select>
<select id="result">
  <option>Win</option><option>Loss</option>
</select>
</div>

<div class="card">
<h3>Structure / Zone</h3>
<div class="checkbox-group">
<label><input type="checkbox" value="Sweep">Sweep</label>
<label><input type="checkbox" value="BOS">BOS</label>
<label><input type="checkbox" value="Equal High">Equal High</label>
<label><input type="checkbox" value="Equal Low">Equal Low</label>
<label><input type="checkbox" value="Asia High">Asia High</label>
<label><input type="checkbox" value="Asia Low">Asia Low</label>
<label><input type="checkbox" value="Higher High">Higher High</label>
<label><input type="checkbox" value="Higher Low">Higher Low</label>
<label><input type="checkbox" value="Lower High">Lower High</label>
<label><input type="checkbox" value="Lower Low">Lower Low</label>
</div>
</div>

<div class="card">
<h3>Zone / Pattern</h3>
<div class="checkbox-group">
<label><input type="checkbox" value="FVG">FVG</label>
<label><input type="checkbox" value="Order Block">Order Block</label>
<label><input type="checkbox" value="Bullish Engulfing">Bullish Engulfing</label>
<label><input type="checkbox" value="Bearish Engulfing">Bearish Engulfing</label>
<label><input type="checkbox" value="Trendline">Trendline</label>
<label><input type="checkbox" value="Fibonacci">Fibonacci</label>
</div>
</div>

<div class="card">
<h3>Trend / Risk</h3>
<div class="checkbox-group">
<label><input type="checkbox" value="EMA M15">EMA M15</label>
<label><input type="checkbox" value="EMA H1">EMA H1</label>
<label><input type="checkbox" value="RR OK">RR OK</label>
<label><input type="checkbox" value="Near Supply">ใกล้ Supply/EMA ❌</label>
</div>
</div>

<div class="card">
<h3>Mindset</h3>
<div class="checkbox-group">
<label><input type="checkbox" value="Calm">ใจนิ่ง</label>
<label><input type="checkbox" value="Plan">ทำตามแผน</label>
<label><input type="checkbox" value="FOMO">FOMO ❌</label>
<label><input type="checkbox" value="Revenge">Revenge ❌</label>
</div>
</div>

<div class="card">
<h3>📝 หมายเหตุ (บังคับ)</h3>
<textarea id="note"></textarea>
</div>

<button class="main" onclick="saveTrade()">บันทึกไม้</button>

<div class="card" id="summary"></div>
<div class="card table-wrap" id="sessionGrade"></div>
<div class="card table-wrap" id="losingStreak"></div>
<div class="card table-wrap" id="weeklyHeatmap"></div>
<div class="card table-wrap" id="sweepHeatmap"></div>
<div class="card table-wrap" id="combo"></div>

<button class="danger" onclick="clearAll()">🧹 ล้างข้อมูลทั้งหมด</button>

<script>
const KEY="PLAYBOOK_FULL";

function load(){return JSON.parse(localStorage.getItem(KEY)||"[]")}
function save(d){localStorage.setItem(KEY,JSON.stringify(d))}

function saveTrade(){
 if(!note.value.trim()){alert("ต้องใส่หมายเหตุ");return}
 const tags=[...document.querySelectorAll("input[type=checkbox]:checked")].map(x=>x.value)
 const d=load()
 d.push({
  date:new Date().toISOString().slice(0,10),
  day:new Date().getDay(),
  session:session.value,
  grade:grade.value,
  result:result.value,
  tags,
  note:note.value
 })
 save(d)
 document.querySelectorAll("input[type=checkbox]").forEach(x=>x.checked=false)
 note.value=""
 render()
}

function render(){
 const d=load()
 if(!d.length){summary.innerHTML="ยังไม่มีข้อมูล";return}
 const win=d.filter(x=>x.result==="Win").length
 summary.innerHTML=`🔥 Win ${win} | Loss ${d.length-win} | WinRate ${(win/d.length*100).toFixed(1)}%`
}

function clearAll(){
 if(confirm("ล้างข้อมูลทั้งหมด?")){
  localStorage.removeItem(KEY)
  location.reload()
 }
}

render()
</script>

</body>
</html>
