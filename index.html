<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journal Clean Base</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  background:#0b0b0b;
  color:#eaeaea;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overflow-x:hidden;
  overflow-y:auto;
}

.page{
  max-width:900px;
  margin:auto;
  padding:12px;
}

.section{
  background:#141414;
  border-radius:12px;
  padding:12px;
  margin-bottom:12px;
}

h3{margin:0 0 8px;font-size:15px}

label{
  display:flex;
  gap:8px;
  align-items:center;
  font-size:14px;
  margin-bottom:6px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}

input,select{
  font-size:16px;
}

@media(max-width:768px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>
<div class="page">

  <div class="section">
    <h3>Structure</h3>
    <div class="grid">
      <label><input type="checkbox"> Sweep</label>
      <label><input type="checkbox"> BOS</label>
      <label><input type="checkbox"> Equal High</label>
      <label><input type="checkbox"> Equal Low</label>
    </div>
  </div>

  <div class="section">
    <h3>Session</h3>
    <select>
      <option>Asia</option>
      <option>London</option>
      <option>New York</option>
    </select>
  </div>

</div>
</body>
</html>
