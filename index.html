<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backtest Final Pro+ (Mindset)</title>
<style>
body{background:#0b0b0b;color:#eee;font-family:Arial;padding:14px}
h1{color:#3cff9a}
section{border:1px solid #222;padding:12px;margin-top:16px;border-radius:8px}
label{display:block;margin:6px 0}
select,input[type=checkbox]{margin-right:6px}
button{width:100%;padding:14px;font-size:18px;border:none;border-radius:6px;margin-top:12px}
.save{background:#32c96a;color:#000}
.clear{background:#e74c3c;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.small{font-size:14px;color:#aaa}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #222;padding:6px;text-align:center}
th{background:#111}
</style>
</head>

<body>
<h1>📊 Backtest Final Pro+ (Mindset)</h1>

<section>
<h3>🕒 Session / Grade</h3>
<select id="session">
<option>Asia</option><option>London</option><option>NY</option>
</select>

<select id="grade">
<option>A+</option><option>A</option><option>B+</option><option>B</option><option>C</option>
</select>

<select id="result">
<option>Win</option><option>Loss</option>
</select>
</section>

<section>
<h3>📈 Indicator</h3>
<label>STO M5
<select id="stoM5"><option>OVS</option><option>OVB</option><option>-</option></select>
</label>
<label>STO M15
<select id="stoM15"><option>OVS</option><option>OVB</option><option>-</option></select>
</label>
</section>

<section>
<h3>🏗 Structure / Zone</h3>
<div class="grid">
<label><input type="checkbox" value="Sweep">Sweep</label>
<label><input type="checkbox" value="BOS">BOS</label>
<label><input type="checkbox" value="HL">Higher Low (HL)</label>
<label><input type="checkbox" value="LH">Lower High (LH)</label>
<label><input type="checkbox" value="Premium">Premium</label>
<label><input type="checkbox" value="Discount">Discount</label>
</div>
</section>

<section>
<h3>📉 Trend / Risk</h3>
<div class="grid">
<label><input type="checkbox" value="EMA_M15">EMA200 เทรนเดียว M15</label>
<label><input type="checkbox" value="EMA_H1">EMA200 เทรนเดียว H1</label>
<label><input type="checkbox" value="RR_OK">RR คุ้ม</label>
<label><input type="checkbox" value="Near_Supply">ใกล้ Supply / EMA ใหญ่ ❌</label>
</div>
</section>

<section>
<h3>🧠 จิตใจ / วินัย</h3>
<div class="grid">
<label><input type="checkbox" value="Calm">ใจนิ่ง ไม่รีบ</label>
<label><input type="checkbox" value="Follow_Plan">ทำตามแผน</label>
<label><input type="checkbox" value="FOMO">FOMO ❌</label>
<label><input type="checkbox" value="Revenge">Revenge Trade ❌</label>
</div>
</section>

<button class="save" onclick="saveTrade()">บันทึกไม้</button>

<section>
<h3>📊 สรุปรวม</h3>
<div id="summary"></div>
</section>

<section>
<h3>🔥 Top 5 Combo</h3>
<table id="comboTable">
<tr><th>Combo</th><th>WinRate</th></tr>
</table>
</section>

<section>
<h3>📌 Session × Grade</h3>
<table id="sgTable">
<tr><th>Session</th><th>Grade</th><th>WinRate</th></tr>
</table>
</section>

<button class="clear" onclick="clearAll()">🗑 ล้างข้อมูลทั้งหมด</button>

<script>
let trades = JSON.parse(localStorage.getItem("trades")||"[]");

function saveTrade(){
  const tags=[...document.querySelectorAll("input[type=checkbox]:checked")].map(x=>x.value);
  trades.push({
    session:session.value,
    grade:grade.value,
    result:result.value,
    stoM5:stoM5.value,
    stoM15:stoM15.value,
    tags,
    date:new Date().toISOString()
  });
  localStorage.setItem("trades",JSON.stringify(trades));
  render();
}

function render(){
  const win=trades.filter(t=>t.result==="Win").length;
  const loss=trades.filter(t=>t.result==="Loss").length;
  const wr=trades.length?((win/trades.length)*100).toFixed(1):0;
  summary.innerHTML=`Win: ${win} | Loss: ${loss} | WinRate: ${wr}%`;

  // Combo
  const comboMap={};
  trades.forEach(t=>{
    const k=t.tags.sort().join("+");
    if(!comboMap[k]) comboMap[k]={w:0,l:0};
    t.result==="Win"?comboMap[k].w++:comboMap[k].l++;
  });
  comboTable.innerHTML="<tr><th>Combo</th><th>WinRate</th></tr>";
  Object.entries(comboMap)
    .map(([k,v])=>({k,wr:(v.w/(v.w+v.l))*100||0}))
    .sort((a,b)=>b.wr-a.wr).slice(0,5)
    .forEach(r=>{
      comboTable.innerHTML+=`<tr><td>${r.k}</td><td>${r.wr.toFixed(1)}%</td></tr>`;
    });

  // Session × Grade
  const sg={};
  trades.forEach(t=>{
    const k=t.session+"_"+t.grade;
    if(!sg[k]) sg[k]={w:0,l:0};
    t.result==="Win"?sg[k].w++:sg[k].l++;
  });
  sgTable.innerHTML="<tr><th>Session</th><th>Grade</th><th>WinRate</th></tr>";
  Object.entries(sg).forEach(([k,v])=>{
    const [s,g]=k.split("_");
    const wr=((v.w/(v.w+v.l))*100)||0;
    sgTable.innerHTML+=`<tr><td>${s}</td><td>${g}</td><td>${wr.toFixed(1)}%</td></tr>`;
  });
}

function clearAll(){
  if(confirm("ล้างข้อมูลทั้งหมด?")){
    localStorage.removeItem("trades");
    trades=[];
    render();
  }
}

render();
</script>
</body>
</html>
