<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Backtest Playbook v6 FULL</title>
<style>
body{background:#0b0b0b;color:#eee;font-family:Arial,Helvetica,sans-serif;padding:14px}
h2,h3{margin:10px 0}
.card{background:#141414;border:1px solid #2a2a2a;border-radius:10px;padding:12px;margin-bottom:12px}
select,textarea,button,input{
  width:100%;margin-top:6px;padding:8px;background:#0f0f0f;color:#eee;border:1px solid #333;border-radius:6px
}
label{margin-right:10px;display:inline-block}
button.main{background:#22c55e;color:#000;font-weight:bold}
button.danger{background:#dc2626;color:#fff}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px}
th,td{border:1px solid #333;padding:6px;text-align:left}
th{background:#222}
.warn{background:#5b1d1d;color:#ff6b6b;font-weight:bold}
.mid{background:#5a4a1d;color:#ffd166}
.ok{background:#1f4f2f;color:#7CFC98}
.alertBox{background:#7a1d1d;color:#fff;padding:10px;border-radius:8px}
.small{font-size:11px;color:#bbb}
</style>
</head>

<body>

<h2>📘 Backtest Playbook v6 FULL</h2>
<div class="small">เก็บข้อมูลเดิม • Sweep ซ้ายสุด • หมายเหตุในสรุป • เหตุแพ้ • Heatmap • Alert</div>

<!-- ================= INPUT ================= -->
<div class="card">
<h3>Session / Grade / Result</h3>
<select id="session"><option>Asia</option><option>London</option><option>New York</option></select>
<select id="grade"><option>A+</option><option>A</option><option>B+</option><option>B</option></select>
<select id="result"><option>Win</option><option>Loss</option></select>
</div>

<div class="card">
<h3>STO</h3>
<label>STO M5
<select id="sto5"><option>None</option><option>OVS</option><option>OVB</option></select>
</label>
<label>STO M15
<select id="sto15"><option>None</option><option>OVS</option><option>OVB</option></select>
</label>
</div>

<div class="card">
<h3>Structure / Zone</h3>
<label><input type="checkbox" value="EqualHigh"> Equal High</label>
<label><input type="checkbox" value="EqualLow"> Equal Low</label>
<label><input type="checkbox" value="AsiaHigh"> Asia High</label>
<label><input type="checkbox" value="AsiaLow"> Asia Low</label>
<label><input type="checkbox" value="PrevHigh"> Prev Day High</label>
<label><input type="checkbox" value="PrevLow"> Prev Day Low</label>
<label><input type="checkbox" value="HH"> Higher High</label>
<label><input type="checkbox" value="HL"> Higher Low</label>
<label><input type="checkbox" value="LH"> Lower High</label>
<label><input type="checkbox" value="LL"> Lower Low</label>
<label><input type="checkbox" value="BOS"> BOS</label>
<label><input type="checkbox" value="Sweep"> Sweep</label>
</div>

<div class="card">
<h3>Zone / Pattern</h3>
<label><input type="checkbox" value="FVG"> FVG</label>
<label><input type="checkbox" value="OB"> Order Block</label>
<label><input type="checkbox" value="BullEng"> Bullish Engulfing</label>
<label><input type="checkbox" value="BearEng"> Bearish Engulfing</label>
<label><input type="checkbox" value="Trendline"> Trendline</label>
<label><input type="checkbox" value="Fibo"> Fibonacci Zone</label>
</div>

<div class="card">
<h3>Trend / Risk</h3>
<label><input type="checkbox" value="EMA_M15"> EMA200 M15</label>
<label><input type="checkbox" value="EMA_H1"> EMA200 H1</label>
<label><input type="checkbox" value="RR_OK"> RR คุ้ม</label>
<label><input type="checkbox" value="NearSupply"> ใกล้ Supply / EMA ❌</label>
</div>

<div class="card">
<h3>Mindset</h3>
<label><input type="checkbox" value="Calm"> ใจนิ่ง</label>
<label><input type="checkbox" value="FollowPlan"> ทำตามแผน</label>
<label><input type="checkbox" value="FOMO"> FOMO ❌</label>
<label><input type="checkbox" value="Revenge"> Revenge ❌</label>
</div>

<div class="card">
<h3>📝 หมายเหตุ (บังคับ)</h3>
<textarea id="note" placeholder="เช่น ตามแผน / หลุดเทรนด์ / สวนเทรนด์ / FOMO / รีบเข้า"></textarea>
</div>

<button class="main" onclick="saveTrade()">บันทึกไม้</button>

<!-- ================= OUTPUT ================= -->
<div class="card" id="summary"></div>
<div class="card" id="combo"></div>
<div class="card" id="lossReason"></div>
<div class="card" id="heatmap"></div>
<div class="card" id="alert"></div>

<button class="danger" onclick="clearAll()">ล้างข้อมูลทั้งหมด</button>

<script>
/* ===== BACKWARD COMPATIBLE STORAGE ===== */
const KEY_NEW = "PLAYBOOK_V6";
const LEGACY_KEYS = ["PLAYBOOK_V51","PLAYBOOK_V5","PLAYBOOK_V4","FINAL_PRO_PLUS_V2"];

function load(){
  let d = JSON.parse(localStorage.getItem(KEY_NEW) || "[]");
  if(d.length) return d;
  for(const k of LEGACY_KEYS){
    const ld = JSON.parse(localStorage.getItem(k) || "[]");
    if(ld.length){
      localStorage.setItem(KEY_NEW, JSON.stringify(ld));
      return ld;
    }
  }
  return [];
}
function save(d){ localStorage.setItem(KEY_NEW, JSON.stringify(d)); }

/* ===== HELPERS ===== */
function extractReason(note){
  if(!note) return "อื่นๆ";
  if(note.includes("FOMO")) return "FOMO";
  if(note.includes("หลุด")) return "หลุดเทรนด์";
  if(note.includes("สวน")) return "สวนเทรนด์";
  if(note.includes("รีบ")) return "รีบเข้า";
  if(note.includes("ตาม")) return "ตามแผน";
  return "อื่นๆ";
}

/* Sweep ซ้ายสุด + แสดงหมายเหตุ */
function buildCombo(t){
  const tags = t.tags || [];
  let arr=[];
  arr.push(tags.includes("Sweep") ? "Sweep" : "No Sweep");
  ["BOS","AsiaLow","AsiaHigh","EqualLow","EqualHigh","FVG","OB","BullEng","BearEng","EMA_H1","EMA_M15"]
    .forEach(x=>{ if(tags.includes(x)) arr.push(x); });
  arr.unshift(t.grade || "-");
  return arr.join(" + ") + " | " + (t.note || "(ไม่มีหมายเหตุ)");
}

/* ===== SAVE ===== */
function saveTrade(){
  if(!note.value.trim()){
    alert("ต้องใส่หมายเหตุทุกไม้");
    return;
  }
  const tags=[...document.querySelectorAll("input[type=checkbox]:checked")].map(x=>x.value);
  const d=load();
  d.push({
    date:new Date().toISOString().slice(0,10),
    session:session.value,
    grade:grade.value,
    result:result.value,
    sto5:sto5.value,
    sto15:sto15.value,
    tags,
    note:note.value.trim(),
    reason:extractReason(note.value)
  });
  save(d);
  document.querySelectorAll("input[type=checkbox]").forEach(x=>x.checked=false);
  note.value="";
  render();
}

/* ===== RENDER ===== */
function render(){
  const d=load();
  if(!d.length){
    summary.innerHTML="ยังไม่มีข้อมูล";
    combo.innerHTML=lossReason.innerHTML=heatmap.innerHTML=alert.innerHTML="";
    return;
  }
  const win=d.filter(x=>x.result==="Win").length;
  summary.innerHTML=`🔥 Win ${win} | Loss ${d.length-win} | WinRate ${(win/d.length*100).toFixed(1)}%`;

  /* Combo Summary */
  const map={};
  d.forEach(t=>{
    const k=buildCombo(t);
    if(!map[k]) map[k]={w:0,l:0};
    t.result==="Win"?map[k].w++:map[k].l++;
  });
  let h="<h3>🔥 Top Combo (Sweep ซ้ายสุด + หมายเหตุ)</h3><table><tr><th>Combo</th><th>Win%</th><th>W/L</th></tr>";
  Object.entries(map).sort((a,b)=>{
    return (b[1].w/(b[1].w+b[1].l))-(a[1].w/(a[1].w+a[1].l));
  }).forEach(([k,v])=>{
    const tot=v.w+v.l; const wr=v.w/tot;
    h+=`<tr class="${wr<0.5?'warn':'ok'}"><td>${k}</td><td>${(wr*100).toFixed(1)}%</td><td>${v.w}/${v.l}</td></tr>`;
  });
  h+="</table>";
  combo.innerHTML=h;

  /* Loss Reason */
  const lossMap={};
  d.filter(x=>x.result==="Loss").forEach(t=>{ lossMap[t.reason]=(lossMap[t.reason]||0)+1; });
  let lr="<h3>❌ เหตุแพ้</h3><table><tr><th>เหตุ</th><th>จำนวน</th></tr>";
  Object.entries(lossMap).forEach(([k,v])=> lr+=`<tr><td>${k}</td><td>${v}</td></tr>`);
  lr+="</table>";
  lossReason.innerHTML=lr;

  /* Heatmap */
  let hm="<h3>🌡️ Heatmap เหตุแพ้</h3><table><tr><th>เหตุ</th><th>จำนวน</th></tr>";
  ["FOMO","หลุดเทรนด์","สวนเทรนด์","รีบเข้า","อื่นๆ"].forEach(r=>{
    const c=lossMap[r]||0;
    let cls=c>=5?"warn":c>=3?"mid":"ok";
    hm+=`<tr class="${cls}"><td>${r}</td><td>${c}</td></tr>`;
  });
  hm+="</table>";
  heatmap.innerHTML=hm;

  /* Alert Streak */
  let streak=0,last="";
  for(let i=d.length-1;i>=0;i--){
    if(d[i].result!=="Loss") break;
    if(last===""||d[i].reason===last){ last=d[i].reason; streak++; } else break;
  }
  alert.innerHTML = streak>=5 ? `<div class="alertBox">⚠️ เตือน: แพ้ <b>${last}</b> ${streak} ไม้ติด</div>` : "";
}

function clearAll(){
  if(confirm("ล้างข้อมูลทั้งหมด?")){
    localStorage.removeItem(KEY_NEW);
    render();
  }
}

render();
</script>

</body>
</html>
