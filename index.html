<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Backtest Playbook – STO Multi TF</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{
 --bg:#0b0b0b;--card:#141414;--line:#2a2a2a;
 --green:#22c55e;--yellow:#ca8a04;--red:#dc2626;
}
*{box-sizing:border-box}
body{background:var(--bg);color:#eee;font-family:Arial;margin:0;padding:12px}
h2{font-size:22px} h3{font-size:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
select,textarea,button{
 width:100%;margin-top:8px;padding:14px;font-size:16px;
 background:#0f0f0f;color:#eee;border:1px solid #333;border-radius:10px
}
textarea{min-height:80px}
.row{display:flex;align-items:center;gap:12px;margin:10px 0}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--green)}
button.main{background:var(--green);color:#000;font-weight:bold}
button.warn{background:var(--yellow);color:#000;font-weight:bold}
button.danger{background:var(--red);color:#fff;font-weight:bold}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
th,td{border:1px solid #333;padding:8px}
th{background:#222}
.ok{background:#1f4f2f}.mid{background:#5a4a1d}.bad{background:#5b1d1d}
</style>
</head>

<body>

<h2>📘 Backtest Playbook – STO Multi TF</h2>

<div class="card">
<h3>Session / Grade / Result</h3>
<select id="session"><option>Asia</option><option>London</option><option>New York</option></select>
<select id="grade"><option>A+</option><option>A</option><option>B+</option><option>B</option><option>C+</option><option>C</option></select>
<select id="result"><option>Win</option><option>Loss</option></select>
</div>

<div class="card">
<h3>📊 STO (Multi Timeframe)</h3>
<select id="sto_m1"><option value="">M1</option><option>OVB</option><option>OVS</option></select>
<select id="sto_m5"><option value="">M5</option><option>OVB</option><option>OVS</option></select>
<select id="sto_m15"><option value="">M15</option><option>OVB</option><option>OVS</option></select>
<select id="sto_h1"><option value="">H1</option><option>OVB</option><option>OVS</option></select>
<select id="sto_h4"><option value="">H4</option><option>OVB</option><option>OVS</option></select>
<select id="sto_d"><option value="">D1</option><option>OVB</option><option>OVS</option></select>
</div>

<div class="card">
<h3>🏗 Structure / Pattern</h3>
<div class="row"><input type="checkbox" value="Sweep"><label>Sweep</label></div>
<div class="row"><input type="checkbox" value="BOS"><label>BOS</label></div>
<div class="row"><input type="checkbox" value="FVG"><label>FVG</label></div>
<div class="row"><input type="checkbox" value="OrderBlock"><label>Order Block</label></div>
</div>

<div class="card">
<h3>📝 Note (บังคับ)</h3>
<textarea id="note"></textarea>
</div>

<button class="main" onclick="saveTrade()">บันทึกไม้</button>
<button class="warn" onclick="exportCSV()">Export CSV</button>

<div class="card" id="summary"></div>
<div class="card" id="analysis"></div>
<div class="card" id="alignment"></div>
<div class="card" id="table"></div>

<button class="danger" onclick="clearAll()">ล้างข้อมูล</button>

<script>
const KEY="STO_PLAYBOOK"
const $=id=>document.getElementById(id)
const load=()=>JSON.parse(localStorage.getItem(KEY)||"[]")
const save=d=>localStorage.setItem(KEY,JSON.stringify(d))

function saveTrade(){
 if(!$("note").value.trim()){alert("ต้องใส่ Note");return}
 const tags=[...document.querySelectorAll("input[type=checkbox]:checked")].map(x=>x.value)
 const sto={
  M1:$("sto_m1").value,M5:$("sto_m5").value,M15:$("sto_m15").value,
  H1:$("sto_h1").value,H4:$("sto_h4").value,D:$("sto_d").value
 }
 const d=load()
 d.push({
  date:new Date().toISOString().slice(0,10),
  session:$("session").value,
  grade:$("grade").value,
  result:$("result").value,
  sto,tags,note:$("note").value
 })
 save(d)
 document.querySelectorAll("select").forEach(x=>x.value="")
 document.querySelectorAll("input[type=checkbox]").forEach(x=>x.checked=false)
 $("note").value=""
 render()
}

function render(){
 const d=load()
 if(!d.length){$("summary").innerHTML="ยังไม่มีข้อมูล";return}
 const w=d.filter(x=>x.result==="Win").length
 $("summary").innerHTML=`Win ${w} / Loss ${d.length-w} / WR ${(w/d.length*100).toFixed(1)}%`
 renderSTOAnalysis(d)
 renderAlignment(d)
 renderTable(d)
}

function renderSTOAnalysis(d){
 const tf=["M1","M5","M15","H1","H4","D"]
 let h="<h3>📊 STO Win Rate</h3><table><tr><th>TF</th><th>OVB</th><th>OVS</th></tr>"
 tf.forEach(t=>{
  let o1={w:0,l:0},o2={w:0,l:0}
  d.forEach(x=>{
   if(x.sto[t]==="OVB")o1[x.result==="Win"?"w":"l"]++
   if(x.sto[t]==="OVS")o2[x.result==="Win"?"w":"l"]++
  })
  h+=`<tr><td>${t}</td>
       <td>${(o1.w/(o1.w+o1.l||1)*100).toFixed(1)}%</td>
       <td>${(o2.w/(o2.w+o2.l||1)*100).toFixed(1)}%</td></tr>`
 })
 $("analysis").innerHTML=h+"</table>"
}

function renderAlignment(d){
 let w=0,l=0
 d.forEach(x=>{
  if(x.sto.M5 && x.sto.M15 && x.sto.M5===x.sto.M15)
   x.result==="Win"?w++:l++
 })
 const wr=w/(w+l||1)
 $("alignment").innerHTML=
 `<h3>🧠 STO Alignment M5 + M15</h3>
  <table><tr class="${wr>=0.7?'ok':wr>=0.4?'mid':'bad'}">
  <td>WR ${(wr*100).toFixed(1)}%</td></tr></table>`
}

function renderTable(d){
 let h="<h3>📋 Trades</h3><table><tr><th>Date</th><th>Result</th><th>STO</th><th>Note</th></tr>"
 d.forEach(x=>{
  h+=`<tr><td>${x.date}</td><td>${x.result}</td>
      <td>${Object.entries(x.sto).map(([k,v])=>v?`${k}:${v}`:"").join(" ")}</td>
      <td>${x.note}</td></tr>`
 })
 $("table").innerHTML=h+"</table>"
}

function exportCSV(){
 const d=load();if(!d.length)return
 let csv="Date,Session,Grade,Result,STO_M1,STO_M5,STO_M15,STO_H1,STO_H4,STO_D,Tags,Note\n"
 d.forEach(x=>{
  csv+=`${x.date},${x.session},${x.grade},${x.result},`
  csv+=`${x.sto.M1},${x.sto.M5},${x.sto.M15},${x.sto.H1},${x.sto.H4},${x.sto.D},`
  csv+=`"${x.tags.join("|")}","${x.note}"\n`
 })
 const a=document.createElement("a")
 a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv"}))
 a.download="STO_Backtest.csv"
 a.click()
}

function clearAll(){
 if(confirm("ล้างข้อมูลทั้งหมด?")){
  localStorage.clear();render()
 }
}
render()
</script>

</body>
</html>
