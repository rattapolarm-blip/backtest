<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backtest Playbook Pro</title>
<style>
body{background:#0b0b0b;color:#eee;font-family:Arial;padding:12px}
h1{color:#4cff4c}
section{border:1px solid #222;padding:12px;margin-top:16px;border-radius:8px}
select,button{width:100%;padding:10px;margin-top:6px;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{background:#151515;padding:8px;border-radius:6px}
button{background:#33cc66;color:#000;font-weight:bold;border:none}
.red{background:#e74c3c;color:#fff}
table{width:100%;margin-top:10px;border-collapse:collapse}
td,th{border:1px solid #333;padding:6px;text-align:center}
.small{font-size:13px;color:#aaa}
</style>
</head>

<body>
<h1>📘 Backtest Playbook (Pro)</h1>

<section>
<b>Session</b>
<select id="session">
<option>Asia</option><option>London</option><option>NY</option>
</select>

<b>Grade</b>
<select id="grade">
<option>A+</option><option>A</option><option>B+</option><option>B</option><option>C</option>
</select>

<b>Result</b>
<select id="result">
<option>Win</option><option>Loss</option>
</select>
</section>

<section>
<h3>📊 STO</h3>
<select id="stoM5"><option>OVS</option><option>OVB</option><option>Mid</option></select>
<select id="stoM15"><option>OVS</option><option>OVB</option><option>Mid</option></select>
</section>

<section>
<h3>🏗 Structure / Zone</h3>
<div class="grid">
<label><input type="checkbox" value="Sweep"> Sweep</label>
<label><input type="checkbox" value="BOS"> BOS</label>
<label><input type="checkbox" value="HL"> Higher Low</label>
<label><input type="checkbox" value="LH"> Lower High</label>
<label><input type="checkbox" value="FVG"> FVG</label>
<label><input type="checkbox" value="OrderBlock"> Order Block</label>
<label><input type="checkbox" value="Premium"> Premium</label>
<label><input type="checkbox" value="Discount"> Discount</label>
<label><input type="checkbox" value="Fib"> Fib ระยะสำคัญ</label>
<label><input type="checkbox" value="Trendline"> Trendline</label>
<label><input type="checkbox" value="BullEngulf"> Bullish Engulf</label>
</div>
</section>

<section>
<h3>📈 Trend / Risk</h3>
<div class="grid">
<label><input type="checkbox" value="EMA_M15"> EMA200 เทรนเดียว M15</label>
<label><input type="checkbox" value="EMA_H1"> EMA200 เทรนเดียว H1</label>
<label><input type="checkbox" value="RR_OK"> RR คุ้ม</label>
<label><input type="checkbox" value="Near_Supply"> ใกล้ Supply / EMA ใหญ่ ❌</label>
</div>
</section>

<section>
<h3>🧠 จิตใจ</h3>
<div class="grid">
<label><input type="checkbox" value="Calm"> ใจนิ่ง</label>
<label><input type="checkbox" value="FollowPlan"> ทำตามแผน</label>
<label><input type="checkbox" value="FOMO"> FOMO ❌</label>
<label><input type="checkbox" value="Revenge"> Revenge ❌</label>
</div>
</section>

<button onclick="saveTrade()">บันทึกไม้</button>

<section>
<h3>📊 สรุปรวม</h3>
<div id="summary"></div>
</section>

<section>
<h3>🔥 Top 5 Combo</h3>
<table id="comboTable">
<tr><th>Combo</th><th>Win%</th></tr>
</table>
</section>

<section>
<h3>📌 Session × Grade</h3>
<table id="sgTable">
<tr><th>Session</th><th>Grade</th><th>Win%</th></tr>
</table>
</section>

<button class="red" onclick="clearAll()">ล้างข้อมูลทั้งหมด</button>

<script>
let data = JSON.parse(localStorage.getItem("pb")) || [];

function saveTrade(){
  let checks=[...document.querySelectorAll("input[type=checkbox]:checked")].map(c=>c.value);
  data.push({
    date:new Date().toISOString().slice(0,10),
    session:session.value,
    grade:grade.value,
    result:result.value,
    combo:checks.sort().join("+")
  });
  localStorage.setItem("pb",JSON.stringify(data));
  render();
}

function render(){
  let win=data.filter(d=>d.result=="Win").length;
  let loss=data.length-win;
  document.getElementById("summary").innerHTML=
    `Win: ${win} | Loss: ${loss} | WinRate: ${(win/(data.length||1)*100).toFixed(1)}%`;

  // Combo
  let map={};
  data.forEach(d=>{
    if(!map[d.combo]) map[d.combo]={w:0,t:0};
    map[d.combo].t++;
    if(d.result=="Win") map[d.combo].w++;
  });
  let rows=Object.entries(map)
    .filter(x=>x[1].t>=2)
    .sort((a,b)=>b[1].w/b[1].t-a[1].w/a[1].t)
    .slice(0,5);
  comboTable.innerHTML="<tr><th>Combo</th><th>Win%</th></tr>";
  rows.forEach(r=>{
    comboTable.innerHTML+=`<tr><td>${r[0]}</td><td>${(r[1].w/r[1].t*100).toFixed(1)}%</td></tr>`;
  });

  // Session × Grade
  let sg={};
  data.forEach(d=>{
    let k=d.session+"|"+d.grade;
    if(!sg[k]) sg[k]={w:0,t:0};
    sg[k].t++;
    if(d.result=="Win") sg[k].w++;
  });
  sgTable.innerHTML="<tr><th>Session</th><th>Grade</th><th>Win%</th></tr>";
  Object.entries(sg).forEach(r=>{
    sgTable.innerHTML+=`<tr><td>${r[0].split("|")[0]}</td><td>${r[0].split("|")[1]}</td><td>${(r[1].w/r[1].t*100).toFixed(1)}%</td></tr>`;
  });
}

function clearAll(){
  if(confirm("ล้างทั้งหมด?")){
    localStorage.clear();
    data=[];
    render();
  }
}
render();
</script>
</body>
</html>
