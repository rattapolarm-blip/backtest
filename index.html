<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trading Journal Dashboard</title>

  <style>
    /* =====================
       GLOBAL / RESET
    ====================== */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0b0b;
      color: #eaeaea;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 16px;
    }

    label {
      display: block;
      font-size: 14px;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      font-size: 16px; /* กัน iOS zoom */
      border-radius: 6px;
      border: none;
      background: #1c1c1c;
      color: #fff;
    }

    /* =====================
       LAYOUT
    ====================== */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px;
      min-height: 100vh;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .section {
      background: #151515;
      padding: 12px;
      border-radius: 10px;
    }

    /* =====================
       CHECKBOX GROUP
    ====================== */
    .checkbox-group {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      cursor: pointer;
      position: relative;
      z-index: 10;
    }

    .checkbox-group input {
      width: auto;
    }

    /* =====================
       ACTION BUTTONS
    ====================== */
    .actions {
      margin-top: 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      flex: 1;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 10px;
      border: none;
      cursor: pointer;
    }

    .btn-save {
      background: #22c55e;
      color: #000;
    }

    .btn-export {
      background: #f59e0b;
      color: #000;
    }

    /* =====================
       MOBILE FIX
    ====================== */
    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .checkbox-group {
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- STRUCTURE / ZONE -->
    <div class="grid">
      <div class="section">
        <h2>Structure / Zone</h2>
        <div class="checkbox-group">
          <label><input type="checkbox"> Sweep</label>
          <label><input type="checkbox"> BOS</label>
          <label><input type="checkbox"> Equal High</label>
          <label><input type="checkbox"> Equal Low</label>
          <label><input type="checkbox"> Asia High</label>
          <label><input type="checkbox"> Asia Low</label>
          <label><input type="checkbox"> Higher High</label>
          <label><input type="checkbox"> Lower Low</label>
        </div>
      </div>

      <!-- ZONE / PATTERN -->
      <div class="section">
        <h2>Zone / Pattern</h2>
        <div class="checkbox-group">
          <label><input type="checkbox"> FVG</label>
          <label><input type="checkbox"> Order Block</label>
          <label><input type="checkbox"> Bullish Engulfing</label>
          <label><input type="checkbox"> Bearish Engulfing</label>
          <label><input type="checkbox"> Trendline</label>
          <label><input type="checkbox"> Fibonacci</label>
        </div>
      </div>

      <!-- TREND / RISK -->
      <div class="section">
        <h2>Trend / Risk</h2>
        <div class="checkbox-group">
          <label><input type="checkbox"> EMA M15</label>
          <label><input type="checkbox"> EMA H1</label>
          <label><input type="checkbox"> RR OK</label>
        </div>
      </div>

      <!-- MINDSET -->
      <div class="section">
        <h2>Mindset</h2>
        <div class="checkbox-group">
          <label><input type="checkbox"> Calm</label>
          <label><input type="checkbox"> Plan</label>
          <label><input type="checkbox"> FOMO</label>
          <label><input type="checkbox"> Revenge</label>
        </div>
      </div>

      <!-- SESSION -->
      <div class="section">
        <h2>Session & Grade</h2>
        <label>Session</label>
        <select>
          <option>Asia</option>
          <option>London</option>
          <option>New York</option>
        </select>

        <label style="margin-top:8px;">Grade</label>
        <select>
          <option>A+</option>
          <option>A</option>
          <option>B+</option>
          <option>B</option>
        </select>
      </div>

      <!-- NOTE -->
      <div class="section">
        <h2>Note</h2>
        <input type="text" placeholder="บันทึกเหตุผล / ความคิด" />
      </div>
    </div>

    <!-- ACTIONS -->
    <div class="actions">
      <button class="btn-save" onclick="saveData()">บันทึก</button>
      <button class="btn-export" onclick="exportExcel()">Export Excel</button>
    </div>

  </div>

  <script>
    function saveData() {
      alert("บันทึกข้อมูลเรียบร้อย (ตัวอย่าง)");
    }

    function exportExcel() {
      alert("Export Excel (ตัวอย่าง)");
    }
  </script>
</body>
</html>
