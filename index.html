<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Backtest Playbook FULL</title>

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<style>
:root{
 --bg:#0b0b0b;
 --card:#141414;
 --line:#2a2a2a;
 --green:#22c55e;
 --yellow:#ca8a04;
 --red:#dc2626;
}
*{box-sizing:border-box}
body{
 background:var(--bg);
 color:#eee;
 font-family:Arial,Helvetica,sans-serif;
 margin:0;
 padding:12px;
}
h2{font-size:22px;margin:10px 0}
h3{font-size:18px;margin:10px 0}

.card{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:16px;
 padding:14px;
 margin-bottom:14px;
}

select,textarea,button{
 width:100%;
 margin-top:8px;
 padding:14px;
 font-size:16px;
 background:#0f0f0f;
 color:#eee;
 border:1px solid #333;
 border-radius:10px;
}
textarea{min-height:90px}

/* checkbox row */
.row{
 display:flex;
 align-items:center;
 gap:12px;
 margin:10px 0;
}
.row label{cursor:pointer}
input[type=checkbox]{
 width:26px;
 height:26px;
 accent-color:var(--green);
}

button.main{background:var(--green);color:#000;font-weight:bold}
button.warn{background:var(--yellow);color:#000;font-weight:bold}
button.danger{background:var(--red);color:#fff;font-weight:bold}

table{
 width:100%;
 border-collapse:collapse;
 margin-top:10px;
 font-size:14px;
}
th,td{
 border:1px solid #333;
 padding:8px;
 text-align:left;
}
th{background:#222}
.ok{background:#1f4f2f}
.mid{background:#5a4a1d}
.bad{background:#5b1d1d}

@media (max-width:768px){
 body{transform:scale(1.12);transform-origin:top center}
 h2{font-size:26px}
 h3{font-size:22px}
 input[type=checkbox]{width:34px;height:34px}
 select,textarea,button{font-size:20px;padding:18px}
 .card{padding:20px;border-radius:18px}
 table{font-size:16px}
 th,td{padding:12px}
}
</style>
</head>

<body>

<h2>📘 Backtest Playbook (FULL)</h2>

<div class="card">
<h3>Session / Grade / Result</h3>
<select id="session">
 <option>Asia</option>
 <option>London</option>
 <option>New York</option>
</select>

<select id="grade">
 <option>A+</option><option>A</option>
 <option>B+</option><option>B</option>
 <option>C+</option><option>C</option>
</select>

<select id="result">
 <option>Win</option>
 <option>Loss</option>
</select>
</div>

<div class="card">
<h3>📊 STO</h3>
<select id="sto5">
 <option>None</option><option>OVB</option><option>OVS</option>
</select>
<select id="sto15">
 <option>None</option><option>OVB</option><option>OVS</option>
</select>
</div>

<div class="card">
<h3>🏗 Structure / Liquidity</h3>
<div class="row"><input id="sweep" type="checkbox" value="Sweep"><label for="sweep">Sweep</label></div>
<div class="row"><input id="bos" type="checkbox" value="BOS"><label for="bos">BOS</label></div>
<div class="row"><input id="liq" type="checkbox" value="Liquidity"><label for="liq">Liquidity (EQH / EQL / Asia)</label></div>
</div>

<div class="card">
<h3>📐 Zone / Pattern</h3>
<div class="row"><input id="fvg" type="checkbox" value="FVG"><label for="fvg">FVG</label></div>
<div class="row"><input id="ob" type="checkbox" value="Order Block"><label for="ob">Order Block</label></div>
<div class="row"><input id="be" type="checkbox" value="Bullish Engulfing"><label for="be">Bullish Engulfing</label></div>
<div class="row"><input id="se" type="checkbox" value="Bearish Engulfing"><label for="se">Bearish Engulfing</label></div>
<div class="row"><input id="pd" type="checkbox" value="Premium Discount"><label for="pd">Premium / Discount (50%)</label></div>
</div>

<div class="card">
<h3>📉 Trend / Risk</h3>
<div class="row"><input id="ema15" type="checkbox" value="EMA200 M15"><label for="ema15">EMA200 M15</label></div>
<div class="row"><input id="ema1h" type="checkbox" value="EMA200 H1"><label for="ema1h">EMA200 H1</label></div>
<div class="row"><input id="rr" type="checkbox" value="RR OK"><label for="rr">RR คุ้ม</label></div>
<div class="row"><input id="near" type="checkbox" value="Near Supply EMA"><label for="near">❌ ใกล้ Supply / EMA</label></div>
</div>

<div class="card">
<h3>🧠 Mindset</h3>
<div class="row"><input id="calm" type="checkbox" value="Calm"><label for="calm">ใจนิ่ง</label></div>
<div class="row"><input id="plan" type="checkbox" value="Plan"><label for="plan">ทำตามแผน</label></div>
<div class="row"><input id="fomo" type="checkbox" value="FOMO"><label for="fomo">FOMO ❌</label></div>
<div class="row"><input id="rev" type="checkbox" value="Revenge"><label for="rev">Revenge ❌</label></div>
</div>

<div class="card">
<h3>📝 หมายเหตุ (บังคับ)</h3>
<textarea id="note"></textarea>
</div>

<button class="main" onclick="saveTrade()">บันทึกไม้</button>
<button class="warn" onclick="exportCSV()">📤 Export Excel</button>

<div class="card" id="summary"></div>
<div class="card" id="sessionGrade"></div>
<div class="card" id="losingStreak"></div>
<div class="card" id="weeklyHeatmap"></div>
<div class="card" id="sweepHeatmap"></div>
<div class="card" id="combo"></div>
<div class="card" id="tradeTable"></div>

<button class="danger" onclick="clearAll()">🧹 ล้างข้อมูลทั้งหมด</button>

<script>
const KEY="PLAYBOOK_FULL";
const $=id=>document.getElementById(id);
function load(){return JSON.parse(localStorage.getItem(KEY)||"[]")}
function save(d){localStorage.setItem(KEY,JSON.stringify(d))}

function saveTrade(){
 if(!$("note").value.trim()){alert("ต้องใส่หมายเหตุ");return}
 const tags=[...document.querySelectorAll("input[type=checkbox]:checked")].map(x=>x.value)
 const d=load()
 d.push({
  date:new Date().toISOString().slice(0,10),
  day:new Date().getDay(),
  session:$("session").value,
  grade:$("grade").value,
  result:$("result").value,
  tags,
  note:$("note").value
 })
 save(d)
 document.querySelectorAll("input[type=checkbox]").forEach(x=>x.checked=false)
 $("note").value=""
 render()
}

function render(){
 const d=load()
 if(!d.length){$("summary").innerHTML="ยังไม่มีข้อมูล";return}
 const w=d.filter(x=>x.result==="Win").length
 $("summary").innerHTML=`🔥 Win ${w} | Loss ${d.length-w} | WR ${(w/d.length*100).toFixed(1)}%`
}

function exportCSV(){
 const d=load(); if(!d.length)return
 let csv="Date,Session,Grade,Result,Tags,Note\n"
 d.forEach(t=>csv+=`${t.date},${t.session},${t.grade},${t.result},"${t.tags.join("|")}","${t.note}"\n`)
 const b=new Blob(["\ufeff"+csv],{type:"text/csv"})
 const a=document.createElement("a")
 a.href=URL.createObjectURL(b);a.download="Backtest.csv";a.click()
}

function clearAll(){
 if(confirm("ล้างข้อมูลทั้งหมด?")){
  localStorage.clear()
  render()
 }
}
render()
</script>

</body>
</html>
