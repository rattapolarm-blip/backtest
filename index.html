<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Backtest Playbook v6.4 FULL</title>
<style>
body{background:#0b0b0b;color:#eee;font-family:Arial;padding:14px}
h2,h3{margin:10px 0}
.card{background:#141414;border:1px solid #2a2a2a;border-radius:10px;padding:12px;margin-bottom:12px}
select,textarea,button,input{
 width:100%;margin-top:6px;padding:8px;
 background:#0f0f0f;color:#eee;border:1px solid #333;border-radius:6px
}
label{margin-right:12px;display:inline-block}
button.main{background:#22c55e;color:#000;font-weight:bold}
button.warn{background:#ca8a04;color:#000}
button.danger{background:#dc2626;color:#fff}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px}
th,td{border:1px solid #333;padding:6px;text-align:left}
th{background:#222}
.ok{background:#1f4f2f}
.mid{background:#5a4a1d}
.bad{background:#5b1d1d}
</style>
</head>

<body>

<h2>📘 Backtest Playbook v6.4 FULL</h2>

<!-- INPUT -->
<div class="card">
<h3>Session / Grade / Result</h3>
<select id="session"><option>Asia</option><option>London</option><option>New York</option></select>
<select id="grade"><option>A+</option><option>A</option><option>B+</option><option>B</option></select>
<select id="result"><option>Win</option><option>Loss</option></select>
</div>

<div class="card">
<h3>Structure / Pattern</h3>
<label><input type="checkbox" value="Sweep"> Sweep</label>
<label><input type="checkbox" value="BOS"> BOS</label>
<label><input type="checkbox" value="FVG"> FVG</label>
<label><input type="checkbox" value="OB"> OB</label>
<label><input type="checkbox" value="EMA"> EMA</label>
</div>

<div class="card">
<h3>📝 หมายเหตุ (บังคับ)</h3>
<textarea id="note" placeholder="เช่น ตามแผน / หลุดเทรนด์ / สวนเทรนด์ / FOMO"></textarea>
</div>

<button class="main" onclick="saveTrade()">บันทึกไม้</button>
<button class="warn" onclick="exportCSV()">📤 Export Excel</button>

<!-- OUTPUT -->
<div class="card" id="summary"></div>
<div class="card" id="combo"></div>
<div class="card" id="sessionGrade"></div>
<div class="card" id="losingStreak"></div>
<div class="card" id="weeklyHeatmap"></div>
<div class="card" id="sweepHeatmap"></div>

<button class="danger" onclick="clearAll()">🧹 ล้างข้อมูลทั้งหมด</button>

<script>
const KEY="PLAYBOOK_V64";

function load(){ return JSON.parse(localStorage.getItem(KEY)||"[]"); }
function save(d){ localStorage.setItem(KEY,JSON.stringify(d)); }

/* ===== SAVE ===== */
function saveTrade(){
 if(!note.value.trim()){ alert("ต้องใส่หมายเหตุ"); return; }
 const tags=[...document.querySelectorAll("input[type=checkbox]:checked")].map(x=>x.value);
 const d=load();
 d.push({
  date:new Date().toISOString().slice(0,10),
  day:new Date().getDay(),
  session:session.value,
  grade:grade.value,
  result:result.value,
  tags,
  note:note.value
 });
 save(d);
 document.querySelectorAll("input[type=checkbox]").forEach(x=>x.checked=false);
 note.value="";
 render();
}

/* ===== COMBO KEY (Sweep หน้าเสมอ) ===== */
function comboKey(t){
 let arr=[];
 arr.push(t.tags.includes("Sweep")?"Sweep":"No Sweep");
 ["BOS","FVG","OB","EMA"].forEach(x=>{ if(t.tags.includes(x))arr.push(x); });
 arr.unshift(t.grade);
 return arr.join(" + ")+" | "+t.note;
}

/* ===== RENDER ===== */
function render(){
 const d=load();
 if(!d.length){
  summary.innerHTML="ยังไม่มีข้อมูล";
  combo.innerHTML=sessionGrade.innerHTML=losingStreak.innerHTML=
  weeklyHeatmap.innerHTML=sweepHeatmap.innerHTML="";
  return;
 }

 const win=d.filter(x=>x.result==="Win").length;
 summary.innerHTML=`🔥 Win ${win} | Loss ${d.length-win} | WinRate ${(win/d.length*100).toFixed(1)}%`;

 renderCombo(d);
 renderSessionGrade(d);
 renderLosingStreak(d);
 renderWeeklyHeatmap(d);
 renderSweepHeatmap(d);
 checkLossAlert(d);
}

/* ===== TOP COMBO ===== */
function renderCombo(d){
 const map={};
 d.forEach(t=>{
  const k=comboKey(t);
  if(!map[k])map[k]={w:0,l:0};
  t.result==="Win"?map[k].w++:map[k].l++;
 });
 let h="<h3>🔥 Top Combo</h3><table><tr><th>Combo</th><th>Win%</th><th>W/L</th></tr>";
 Object.entries(map).forEach(([k,v])=>{
  const wr=v.w/(v.w+v.l);
  h+=`<tr class="${wr>=0.7?'ok':wr>=0.4?'mid':'bad'}">
      <td>${k}</td><td>${(wr*100).toFixed(1)}%</td><td>${v.w}/${v.l}</td></tr>`;
 });
 h+="</table>";
 combo.innerHTML=h;
}

/* ===== SESSION x GRADE ===== */
function renderSessionGrade(d){
 const m={};
 d.forEach(t=>{
  const k=t.session+"|"+t.grade;
  if(!m[k])m[k]={w:0,l:0};
  t.result==="Win"?m[k].w++:m[k].l++;
 });
 let s="<h3>📌 Session × Grade</h3><table><tr><th>Session</th><th>Grade</th><th>WinRate</th></tr>";
 Object.entries(m).forEach(([k,v])=>{
  const [se,gr]=k.split("|");
  s+=`<tr><td>${se}</td><td>${gr}</td>
      <td>${(v.w/(v.w+v.l)*100).toFixed(1)}%</td></tr>`;
 });
 s+="</table>";
 sessionGrade.innerHTML=s;
}

/* ===== LOSING STREAK ===== */
function renderLosingStreak(d){
 let streak=0;
 for(let i=d.length-1;i>=0;i--){
  if(d[i].result==="Loss") streak++;
  else break;
 }
 losingStreak.innerHTML=
 `<h3>📉 Losing Streak</h3>
 <table><tr><th>วันที่</th><th>แพ้ติด</th></tr>
 <tr><td>${d[d.length-1].date}</td><td>${streak}</td></tr></table>`;
}

/* ===== WEEKLY HEATMAP ===== */
function renderWeeklyHeatmap(d){
 const days=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
 let w=Array(7).fill(0).map(()=>({w:0,l:0}));
 d.forEach(t=>{ t.result==="Win"?w[t.day].w++:w[t.day].l++; });
 let h="<h3>📊 Heatmap วันในสัปดาห์</h3><table><tr><th>วัน</th><th>Win</th><th>Loss</th><th>WinRate</th></tr>";
 w.forEach((x,i)=>{
  const tot=x.w+x.l;
  const wr=tot?x.w/tot:0;
  h+=`<tr class="${wr>=0.7?'ok':wr>=0.4?'mid':'bad'}">
      <td>${days[i]}</td><td>${x.w}</td><td>${x.l}</td>
      <td>${(wr*100).toFixed(1)}%</td></tr>`;
 });
 h+="</table>";
 weeklyHeatmap.innerHTML=h;
}

/* ===== SWEEP vs NO SWEEP ===== */
function renderSweepHeatmap(d){
 let s={w:0,l:0}, n={w:0,l:0};
 d.forEach(t=>{
  if(t.tags.includes("Sweep")){
    t.result==="Win"?s.w++:s.l++;
  }else{
    t.result==="Win"?n.w++:n.l++;
  }
 });
 sweepHeatmap.innerHTML=
 `<h3>📊 Heatmap : Sweep vs No Sweep</h3>
 <table><tr><th>Type</th><th>Win</th><th>Loss</th><th>WinRate</th></tr>
 <tr><td>Sweep</td><td>${s.w}</td><td>${s.l}</td>
     <td>${(s.w/(s.w+s.l||1)*100).toFixed(1)}%</td></tr>
 <tr><td>No Sweep</td><td>${n.w}</td><td>${n.l}</td>
     <td>${(n.w/(n.w+n.l||1)*100).toFixed(1)}%</td></tr>
 </table>`;
}

/* ===== ALERT : LOSS SAME REASON 5 ===== */
function checkLossAlert(d){
 if(d.length<5) return;
 const today=new Date().toISOString().slice(0,10);
 const key="ALERT_"+today;
 if(localStorage.getItem(key)) return;
 const last=d.slice(-5);
 if(last.every(x=>x.result==="Loss") &&
    last.every(x=>x.note===last[0].note)){
   alert("⚠️ เตือน: แพ้เหตุเดิม 5 ไม้ติด\nเหตุ: "+last[0].note);
   localStorage.setItem(key,"1");
 }
}

/* ===== EXPORT CSV ===== */
function exportCSV(){
 const d=load();
 if(!d.length){alert("ไม่มีข้อมูล");return;}
 let csv="Date,Session,Grade,Result,Tags,Note\n";
 d.forEach(t=>{
  csv+=`${t.date},${t.session},${t.grade},${t.result},"${t.tags.join("|")}","${t.note}"\n`;
 });
 const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8;"});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download="Backtest_Playbook.csv";
 a.click();
}

/* ===== CLEAR ===== */
function clearAll(){
 if(confirm("ล้างข้อมูลทั้งหมด?")){
  localStorage.clear();
  render();
 }
}

render();
</script>

</body>
</html>
