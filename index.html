<script>
/* ================= CONFIG ================= */
const KEY = "FINAL_PRO_PLUS_V2";

/* ================= STORAGE ================= */
function load(){ return JSON.parse(localStorage.getItem(KEY) || "[]"); }
function save(d){ localStorage.setItem(KEY, JSON.stringify(d)); }

/* ================= SCORE ================= */
function scoreTrade(tags){
  let s = 0;
  if(tags.includes("Sweep")) s += 2;
  if(tags.includes("BOS")) s += 2;
  if(tags.includes("HL_LH")) s += 1;
  if(tags.includes("FVG")) s += 1;
  if(tags.includes("OB")) s += 1;
  if(tags.includes("EMA_TREND")) s += 1;
  if(tags.includes("RR_OK")) s += 1;
  if(tags.includes("CONFIRM")) s += 1;
  if(tags.includes("CALM")) s += 1;

  if(tags.includes("FOMO")) s -= 2;
  if(tags.includes("REVENGE")) s -= 2;
  if(tags.includes("NEAR_EMA")) s -= 1;
  return s;
}

/* ================= BUILD COMBO KEY ================= */
/* เอา Sweep นำ + เกรด + ดึงเหตุจากหมายเหตุ */
function buildComboKey(trade){
  const tags = trade.tags || [];
  let tools = [];

  if(tags.includes("Sweep")) tools.push("Sweep");
  if(tags.includes("OB")) tools.push("OB");
  if(tags.includes("BOS")) tools.push("BOS");
  if(tags.includes("FVG")) tools.push("FVG");
  if(tags.includes("EMA_TREND")) tools.push("EMA");

  if(!tags.includes("Sweep")) tools.unshift("No Sweep");
  if(trade.grade) tools.unshift(trade.grade);

  let reason = "";
  if(trade.note){
    if(trade.note.includes("หลุด")) reason = "หลุดเทรนด์";
    else if(trade.note.includes("สวน")) reason = "สวนเทรนด์";
    else if(trade.note.includes("FOMO")) reason = "FOMO";
  }

  return reason ? `${tools.join(" + ")} | ${reason}` : tools.join(" + ");
}

/* ================= SAVE TRADE ================= */
function saveTrade(){
  const data = load();
  const tags = [...document.querySelectorAll("input[type=checkbox]:checked")]
                .map(c=>c.value);

  const trade = {
    date: new Date().toISOString().slice(0,10),
    session: session.value,
    grade: grade.value,
    result: result.value,
    tags,
    score: scoreTrade(tags),
    note: note.value
  };

  data.push(trade);
  save(data);

  document.querySelectorAll("input[type=checkbox]").forEach(c=>c.checked=false);
  note.value="";
  render();
}

/* ================= SUMMARY ================= */
function render(){
  const d = load();
  if(!d.length){
    summary.innerHTML = "ยังไม่มีข้อมูล";
    comboSummary.innerHTML = "";
    return;
  }

  const win = d.filter(x=>x.result==="Win").length;
  const loss = d.length - win;
  const avgScore = (d.reduce((a,b)=>a+b.score,0)/d.length).toFixed(2);

  summary.innerHTML = `
    Win: <b style="color:#4cff4c">${win}</b> |
    Loss: <b style="color:#ff4c4c">${loss}</b> |
    WinRate: ${(win/d.length*100).toFixed(1)}% |
    Avg Score: ${avgScore}
  `;

  renderComboSummary(d);
}

/* ================= COMBO SUMMARY ================= */
/* สรุปชนะ–แพ้ ตามเทคนิค + หมายเหตุ เป็น % */
function renderComboSummary(trades){
  const map = {};

  trades.forEach(t=>{
    const key = buildComboKey(t);
    if(!map[key]) map[key] = {win:0, loss:0};
    t.result === "Win" ? map[key].win++ : map[key].loss++;
  });

  let html = `
  <table>
    <tr>
      <th>เทคนิค / เหตุผล</th>
      <th>Win %</th>
      <th>Win / Loss</th>
    </tr>`;

  Object.entries(map)
    .sort((a,b)=>{
      const wa = a[1].win/(a[1].win+a[1].loss || 1);
      const wb = b[1].win/(b[1].win+b[1].loss || 1);
      return wb - wa;
    })
    .forEach(([k,v])=>{
      const total = v.win + v.loss;
      const wr = total ? (v.win/total*100).toFixed(1) : 0;
      html += `
      <tr>
        <td>${k}</td>
        <td>${wr}%</td>
        <td>${v.win} / ${v.loss}</td>
      </tr>`;
    });

  html += "</table>";
  comboSummary.innerHTML = html;
}

/* ================= CLEAR ================= */
function clearAll(){
  if(confirm("ล้างข้อมูลทั้งหมด?")){
    localStorage.removeItem(KEY);
    render();
  }
}

render();
</script>
