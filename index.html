<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Backtest Playbook v4 FULL</title>
<style>
body{background:#0b0b0b;color:#eee;font-family:Arial,Helvetica,sans-serif;padding:14px}
h2,h3{margin:10px 0}
.card{background:#141414;border:1px solid #2a2a2a;border-radius:10px;padding:12px;margin-bottom:12px}
select,textarea,button{
  width:100%;margin-top:6px;padding:8px;
  background:#0f0f0f;color:#eee;border:1px solid #333;border-radius:6px
}
label{margin-right:10px;display:inline-block}
button.main{background:#22c55e;color:#000;font-weight:bold}
button.danger{background:#dc2626;color:#fff}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}
th,td{border:1px solid #333;padding:6px;text-align:left}
th{background:#222}
.warn{color:#ff4d4d;font-weight:bold}
.ok{color:#22c55e}
</style>
</head>

<body>

<h2>📘 Backtest Playbook v4 FULL</h2>

<div class="card">
<h3>Session / Grade / Result</h3>
<select id="session">
  <option>Asia</option><option>London</option><option>New York</option>
</select>
<select id="grade">
  <option>A+</option><option>A</option><option>B+</option><option>B</option>
</select>
<select id="result">
  <option>Win</option><option>Loss</option>
</select>
</div>

<div class="card">
<h3>Structure / Pattern</h3>
<label><input type="checkbox" value="Sweep"> Sweep</label>
<label><input type="checkbox" value="BOS"> BOS</label>
<label><input type="checkbox" value="FVG"> FVG</label>
<label><input type="checkbox" value="OB"> Order Block</label>
<label><input type="checkbox" value="EMA"> EMA</label>
</div>

<div class="card">
<h3>📝 หมายเหตุ (บังคับทุกไม้)</h3>
<textarea id="note" placeholder="ตามแผน / หลุดเทรนด์ / สวนเทรนด์ / FOMO"></textarea>
</div>

<button class="main" onclick="saveTrade()">บันทึกไม้</button>

<div class="card" id="summary"></div>
<div class="card" id="combo"></div>
<div class="card" id="lossReason"></div>
<div class="card" id="heatmap"></div>
<div class="card" id="alert"></div>

<button class="danger" onclick="clearAll()">ล้างข้อมูลทั้งหมด</button>

<script>
const KEY="PLAYBOOK_V4";

/* ---------- STORAGE ---------- */
function load(){return JSON.parse(localStorage.getItem(KEY)||"[]")}
function save(d){localStorage.setItem(KEY,JSON.stringify(d))}

/* ---------- REASON ---------- */
function reasonFromNote(note){
  if(note.includes("FOMO")) return "FOMO";
  if(note.includes("หลุด")) return "หลุดเทรนด์";
  if(note.includes("สวน")) return "สวนเทรนด์";
  if(note.includes("ตาม")) return "ตามแผน";
  return "อื่นๆ";
}

/* ---------- COMBO (Sweep first) ---------- */
function buildCombo(t){
  let tools=[];
  if(t.tags.includes("Sweep")) tools.push("Sweep");
  if(t.tags.includes("BOS")) tools.push("BOS");
  if(t.tags.includes("FVG")) tools.push("FVG");
  if(t.tags.includes("OB")) tools.push("OB");
  if(t.tags.includes("EMA")) tools.push("EMA");
  if(!t.tags.includes("Sweep")) tools.unshift("No Sweep");
  tools.unshift(t.grade);
  return tools.join(" + ")+" | "+t.reason;
}

/* ---------- SAVE ---------- */
function saveTrade(){
  if(!note.value.trim()){
    alert("ต้องใส่หมายเหตุทุกไม้");
    return;
  }
  const tags=[...document.querySelectorAll("input[type=checkbox]:checked")].map(x=>x.value);
  const d=load();
  d.push({
    date:new Date().toISOString().slice(0,10),
    session:session.value,
    grade:grade.value,
    result:result.value,
    tags,
    note:note.value.trim(),
    reason:reasonFromNote(note.value)
  });
  save(d);
  document.querySelectorAll("input[type=checkbox]").forEach(x=>x.checked=false);
  note.value="";
  render();
}

/* ---------- RENDER ---------- */
function render(){
  const d=load();
  if(!d.length){
    summary.innerHTML="ยังไม่มีข้อมูล";
    combo.innerHTML="";
    lossReason.innerHTML="";
    heatmap.innerHTML="";
    alert.innerHTML="";
    return;
  }

  /* SUMMARY */
  const win=d.filter(x=>x.result==="Win").length;
  summary.innerHTML=`🔥 Win ${win} | Loss ${d.length-win} | WinRate ${(win/d.length*100).toFixed(1)}%`;

  /* TOP COMBO */
  const map={};
  d.forEach(t=>{
    const k=buildCombo(t);
    if(!map[k]) map[k]={w:0,l:0};
    t.result==="Win"?map[k].w++:map[k].l++;
  });
  let h="<h3>🔥 Top Combo</h3><table><tr><th>Combo</th><th>Win%</th><th>W/L</th></tr>";
  Object.entries(map).sort((a,b)=>{
    return (b[1].w/(b[1].w+b[1].l))-(a[1].w/(a[1].w+a[1].l))
  }).forEach(([k,v])=>{
    const t=v.w+v.l;
    h+=`<tr><td>${k}</td><td>${(v.w/t*100).toFixed(1)}%</td><td>${v.w}/${v.l}</td></tr>`;
  });
  h+="</table>";
  combo.innerHTML=h;

  /* LOSS REASON */
  const lossMap={};
  d.filter(x=>x.result==="Loss").forEach(t=>{
    lossMap[t.reason]=(lossMap[t.reason]||0)+1;
  });
  let lr="<h3>❌ เหตุแพ้</h3><table><tr><th>เหตุ</th><th>จำนวน</th></tr>";
  Object.entries(lossMap).forEach(([k,v])=>{
    lr+=`<tr><td>${k}</td><td>${v}</td></tr>`;
  });
  lr+="</table>";
  lossReason.innerHTML=lr;

  /* HEATMAP */
  let hm="<h3>📊 Heatmap เหตุแพ้</h3><table><tr><th>เหตุ</th><th>จำนวน</th></tr>";
  ["FOMO","หลุดเทรนด์","สวนเทรนด์"].forEach(r=>{
    const c=lossMap[r]||0;
    hm+=`<tr><td>${r}</td><td class="${c>=3?'warn':'ok'}">${c}</td></tr>`;
  });
  hm+="</table>";
  heatmap.innerHTML=hm;

  /* ALERT 5 LOSS STREAK */
  let streak=0,last="";
  for(let i=d.length-1;i>=0;i--){
    if(d[i].result!=="Loss") break;
    if(last===""||d[i].reason===last){
      last=d[i].reason;streak++;
    }else break;
  }
  alert.innerHTML = streak>=5
    ? `<h3 class="warn">⚠️ เตือน: แพ้ ${streak} ไม้ติด เพราะ ${last}</h3>`
    : "";
}

/* ---------- CLEAR ---------- */
function clearAll(){
  if(confirm("ล้างข้อมูลทั้งหมด?")){
    localStorage.removeItem(KEY);
    render();
  }
}

render();
</script>

</body>
</html>
