<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Backtest Playbook FULL</title>

<!-- 🔑 สำคัญมากสำหรับมือถือ -->
<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<style>
/* ========== THEME ========== */
:root{
 --bg:#0b0b0b;
 --card:#141414;
 --line:#2a2a2a;
 --green:#22c55e;
 --yellow:#ca8a04;
 --red:#dc2626;
}
*{box-sizing:border-box}
body{
 background:var(--bg);
 color:#eee;
 font-family:Arial,Helvetica,sans-serif;
 margin:0;
 padding:12px;
}

/* ========== HEAD ========== */
h2{font-size:22px;margin:10px 0}
h3{font-size:18px;margin:10px 0}

/* ========== CARD ========== */
.card{
 background:var(--card);
 border:1px solid var(--line);
 border-radius:16px;
 padding:14px;
 margin-bottom:14px;
}

/* ========== INPUT ========== */
select,textarea,button{
 width:100%;
 margin-top:8px;
 padding:14px;
 font-size:16px;
 background:#0f0f0f;
 color:#eee;
 border:1px solid #333;
 border-radius:10px;
}
textarea{min-height:90px}

/* ========== CHECKBOX ========== */
label{
 display:inline-flex;
 align-items:center;
 gap:10px;
 margin:8px 14px 8px 0;
 font-size:16px;
}
input[type=checkbox]{
 width:26px;
 height:26px;
 accent-color:var(--green);
}

/* ========== BUTTON ========== */
button.main{background:var(--green);color:#000;font-weight:bold}
button.warn{background:var(--yellow);color:#000;font-weight:bold}
button.danger{background:var(--red);color:#fff;font-weight:bold}

/* ========== TABLE ========== */
table{
 width:100%;
 border-collapse:collapse;
 margin-top:10px;
 font-size:14px;
}
th,td{
 border:1px solid #333;
 padding:8px;
 text-align:left;
}
th{background:#222}
.ok{background:#1f4f2f}
.mid{background:#5a4a1d}
.bad{background:#5b1d1d}

/* ================= MOBILE BOOST (ตัวแก้จริง) ================= */
@media (max-width:768px){

 body{
   transform:scale(1.12);   /* ✅ ขยายจริงบนมือถือ */
   transform-origin:top center;
 }

 h2{font-size:26px}
 h3{font-size:22px}

 label{
   font-size:20px;
   gap:14px;
   margin:12px 0;
 }

 input[type=checkbox]{
   width:34px;
   height:34px;
 }

 select,textarea,button{
   font-size:20px;
   padding:18px;
 }

 .card{
   padding:20px;
   border-radius:18px;
 }

 table{
   font-size:16px;
 }

 th,td{
   padding:12px;
 }
}
</style>
</head>

<body>

<h2>📘 Backtest Playbook (FULL)</h2>

<!-- ================= INPUT ================= -->

<div class="card">
<h3>Session / Grade / Result</h3>
<select id="session">
 <option>Asia</option>
 <option>London</option>
 <option>New York</option>
</select>

<select id="grade">
 <option>A+</option>
 <option>A</option>
 <option>B+</option>
 <option>B</option>
 <option>C+</option>
 <option>C</option>
</select>

<select id="result">
 <option>Win</option>
 <option>Loss</option>
</select>
</div>

<div class="card">
<h3>📊 STO</h3>
<select id="sto5">
 <option>None</option>
 <option>OVB</option>
 <option>OVS</option>
</select>
<select id="sto15">
 <option>None</option>
 <option>OVB</option>
 <option>OVS</option>
</select>
</div>

<div class="card">
<h3>🏗 Structure / Zone</h3>
<label><input type="checkbox" value="Sweep">Sweep</label>
<label><input type="checkbox" value="BOS">BOS</label>
<label><input type="checkbox" value="Equal High">Equal High</label>
<label><input type="checkbox" value="Equal Low">Equal Low</label>
<label><input type="checkbox" value="Asia High">Asia High</label>
<label><input type="checkbox" value="Asia Low">Asia Low</label>
<label><input type="checkbox" value="Higher High">Higher High</label>
<label><input type="checkbox" value="Lower Low">Lower Low</label>
</div>

<div class="card">
<h3>📐 Zone / Pattern</h3>
<label><input type="checkbox" value="FVG">FVG</label>
<label><input type="checkbox" value="Order Block">Order Block</label>
<label><input type="checkbox" value="Bullish Engulfing">Bullish Engulfing</label>
<label><input type="checkbox" value="Bearish Engulfing">Bearish Engulfing</label>
<label><input type="checkbox" value="Trendline">Trendline</label>
<label><input type="checkbox" value="Fibo">Fibonacci Zone</label>
</div>

<div class="card">
<h3>📉 Trend / Risk</h3>
<label><input type="checkbox" value="EMA M15">EMA200 M15</label>
<label><input type="checkbox" value="EMA H1">EMA200 H1</label>
<label><input type="checkbox" value="RR OK">RR คุ้ม</label>
<label><input type="checkbox" value="Near EMA">ใกล้ Supply / EMA ❌</label>
</div>

<div class="card">
<h3>🧠 Mindset</h3>
<label><input type="checkbox" value="Calm">ใจนิ่ง</label>
<label><input type="checkbox" value="Plan">ทำตามแผน</label>
<label><input type="checkbox" value="FOMO">FOMO ❌</label>
<label><input type="checkbox" value="Revenge">Revenge ❌</label>
</div>

<div class="card">
<h3>📝 หมายเหตุ (บังคับ)</h3>
<textarea id="note" placeholder="เช่น ตามแผน / หลุดเทรนด์ / สวนเทรนด์ / FOMO"></textarea>
</div>

<button class="main" onclick="saveTrade()">บันทึกไม้</button>
<button class="warn" onclick="exportCSV()">📤 Export Excel</button>

<!-- ================= OUTPUT ================= -->

<div class="card" id="summary"></div>
<div class="card" id="sessionGrade"></div>
<div class="card" id="losingStreak"></div>
<div class="card" id="weeklyHeatmap"></div>
<div class="card" id="sweepHeatmap"></div>
<div class="card" id="combo"></div>
<div class="card" id="tradeTable"></div>

<button class="danger" onclick="clearAll()">🧹 ล้างข้อมูลทั้งหมด</button>

<!-- ================= SCRIPT ================= -->
<script>
const KEY="PLAYBOOK_FULL";

function load(){return JSON.parse(localStorage.getItem(KEY)||"[]")}
function save(d){localStorage.setItem(KEY,JSON.stringify(d))}

function saveTrade(){
 if(!note.value.trim()){alert("ต้องใส่หมายเหตุ");return}
 const tags=[...document.querySelectorAll("input[type=checkbox]:checked")].map(x=>x.value)
 const d=load()
 d.push({
  date:new Date().toISOString().slice(0,10),
  day:new Date().getDay(),
  session:session.value,
  grade:grade.value,
  result:result.value,
  tags,
  note:note.value
 })
 save(d)
 document.querySelectorAll("input[type=checkbox]").forEach(x=>x.checked=false)
 note.value=""
 render()
}

/* ===== RENDER ALL ===== */
function render(){
 const d=load()
 if(!d.length){summary.innerHTML="ยังไม่มีข้อมูล";return}
 const win=d.filter(x=>x.result==="Win").length
 summary.innerHTML=`🔥 Win ${win} | Loss ${d.length-win} | WinRate ${(win/d.length*100).toFixed(1)}%`
 renderSessionGrade(d)
 renderLosingStreak(d)
 renderWeeklyHeatmap(d)
 renderSweepHeatmap(d)
 renderCombo(d)
 renderWinLossTables(d)
}

/* ===== SESSION x GRADE ===== */
function renderSessionGrade(d){
 const m={}
 d.forEach(t=>{
  const k=t.session+"|"+t.grade
  if(!m[k])m[k]={w:0,l:0}
  t.result==="Win"?m[k].w++:m[k].l++
 })
 let h="<h3>📌 Session × Grade</h3><table><tr><th>Session</th><th>Grade</th><th>WR</th></tr>"
 Object.entries(m).forEach(([k,v])=>{
  const [s,g]=k.split("|")
  const wr=v.w/(v.w+v.l||1)
  h+=`<tr class="${wr>=0.7?'ok':wr>=0.4?'mid':'bad'}">
      <td>${s}</td><td>${g}</td><td>${(wr*100).toFixed(1)}%</td></tr>`
 })
 sessionGrade.innerHTML=h+"</table>"
}

/* ===== LOSING STREAK ===== */
function renderLosingStreak(d){
 let s=0
 for(let i=d.length-1;i>=0;i--){
  if(d[i].result==="Loss")s++; else break
 }
 losingStreak.innerHTML=`<h3>📉 Losing Streak</h3>
 <table><tr><th>ล่าสุด</th><th>แพ้ติด</th></tr>
 <tr><td>${d[d.length-1].date}</td><td>${s}</td></tr></table>`
}

/* ===== WEEKLY HEATMAP ===== */
function renderWeeklyHeatmap(d){
 const days=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"]
 let w=Array(7).fill(0).map(()=>({w:0,l:0}))
 d.forEach(t=>{t.result==="Win"?w[t.day].w++:w[t.day].l++})
 let h="<h3>📊 Heatmap วันในสัปดาห์</h3><table><tr><th>วัน</th><th>Win</th><th>Loss</th><th>WR</th></tr>"
 w.forEach((x,i)=>{
  const tot=x.w+x.l,wr=tot?x.w/tot:0
  h+=`<tr class="${wr>=0.7?'ok':wr>=0.4?'mid':'bad'}">
      <td>${days[i]}</td><td>${x.w}</td><td>${x.l}</td><td>${(wr*100).toFixed(1)}%</td></tr>`
 })
 weeklyHeatmap.innerHTML=h+"</table>"
}

/* ===== SWEEP vs NO SWEEP ===== */
function renderSweepHeatmap(d){
 let s={w:0,l:0},n={w:0,l:0}
 d.forEach(t=>{
  (t.tags.includes("Sweep")?s:n)[t.result==="Win"?"w":"l"]++
 })
 sweepHeatmap.innerHTML=`<h3>📊 Sweep vs No Sweep</h3>
 <table><tr><th>Type</th><th>Win</th><th>Loss</th><th>WR</th></tr>
 <tr><td>Sweep</td><td>${s.w}</td><td>${s.l}</td><td>${(s.w/(s.w+s.l||1)*100).toFixed(1)}%</td></tr>
 <tr><td>No Sweep</td><td>${n.w}</td><td>${n.l}</td><td>${(n.w/(n.w+n.l||1)*100).toFixed(1)}%</td></tr>
 </table>`
}

/* ===== TOP COMBO ===== */
function renderCombo(d){
 const m={}
 d.forEach(t=>{
  const k=[t.grade,(t.tags.includes("Sweep")?"Sweep":"No Sweep"),...t.tags.filter(x=>x!=="Sweep")].join(" + ")+" | "+t.note
  if(!m[k])m[k]={w:0,l:0}
  t.result==="Win"?m[k].w++:m[k].l++
 })
 let h="<h3>🔥 Top Combo</h3><table><tr><th>Combo</th><th>WR</th><th>W/L</th></tr>"
 Object.entries(m).forEach(([k,v])=>{
  const wr=v.w/(v.w+v.l||1)
  h+=`<tr class="${wr>=0.7?'ok':wr>=0.4?'mid':'bad'}">
      <td>${k}</td><td>${(wr*100).toFixed(1)}%</td><td>${v.w}/${v.l}</td></tr>`
 })
 combo.innerHTML=h+"</table>"
}

/* ===== WIN / LOSS TABLE ===== */
function renderWinLossTables(d){
 const win=d.filter(x=>x.result==="Win")
 const loss=d.filter(x=>x.result==="Loss")
 function t(title,a){
  let h=`<h3>${title}</h3>
  <table><tr><th>Date</th><th>Session</th><th>Grade</th><th>Tags</th><th>Note</th></tr>`
  a.forEach(x=>{
   h+=`<tr><td>${x.date}</td><td>${x.session}</td><td>${x.grade}</td>
        <td>${x.tags.join(" | ")}</td><td>${x.note}</td></tr>`
  })
  return h+"</table>"
 }
 tradeTable.innerHTML=t("📗 ไม้ชนะ",win)+t("📕 ไม้แพ้",loss)
}

/* ===== EXPORT ===== */
function exportCSV(){
 const d=load(); if(!d.length)return
 let csv="Date,Session,Grade,Result,Tags,Note\n"
 d.forEach(t=>csv+=`${t.date},${t.session},${t.grade},${t.result},"${t.tags.join("|")}","${t.note}"\n`)
 const b=new Blob(["\ufeff"+csv],{type:"text/csv"})
 const a=document.createElement("a")
 a.href=URL.createObjectURL(b);a.download="Backtest.csv";a.click()
}

/* ===== CLEAR ===== */
function clearAll(){
 if(confirm("ล้างข้อมูลทั้งหมด?")){
  localStorage.clear()
  render()
 }
}

render()
</script>

</body>
</html>
