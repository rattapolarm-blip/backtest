<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Backtest Playbook v3 PRO</title>
<style>
body{
  background:#0f0f0f;
  color:#eee;
  font-family:Arial,Helvetica,sans-serif;
  padding:16px;
}
h2,h3{margin:8px 0}
.card{
  background:#161616;
  border:1px solid #2a2a2a;
  border-radius:8px;
  padding:12px;
  margin-bottom:12px;
}
select,textarea,button{
  width:100%;
  margin-top:6px;
  padding:8px;
  background:#111;
  color:#eee;
  border:1px solid #333;
  border-radius:6px;
}
button{
  background:#1fbf75;
  color:#000;
  font-weight:bold;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:8px;
}
th,td{
  border:1px solid #333;
  padding:6px;
  text-align:left;
}
th{background:#222}
.tag{margin-right:8px}
</style>
</head>

<body>

<h2>📘 Backtest Playbook v3 PRO</h2>

<div class="card">
<h3>Session / Grade / Result</h3>
<select id="session">
  <option>Asia</option><option>London</option><option>New York</option>
</select>
<select id="grade">
  <option>A+</option><option>A</option><option>B+</option><option>B</option>
</select>
<select id="result">
  <option>Win</option><option>Loss</option>
</select>
</div>

<div class="card">
<h3>Structure / Pattern</h3>
<label class="tag"><input type="checkbox" value="Sweep"> Sweep</label>
<label class="tag"><input type="checkbox" value="BOS"> BOS</label>
<label class="tag"><input type="checkbox" value="FVG"> FVG</label>
<label class="tag"><input type="checkbox" value="OB"> Order Block</label>
<label class="tag"><input type="checkbox" value="EMA"> EMA</label>
</div>

<div class="card">
<h3>📝 หมายเหตุ (บังคับทุกไม้)</h3>
<textarea id="note" placeholder="เช่น ตามแผน / หลุดเทรนด์ / สวนเทรนด์ / FOMO"></textarea>
</div>

<button onclick="saveTrade()">บันทึกไม้</button>

<div class="card" id="summary"></div>
<div class="card" id="combo"></div>

<script>
const KEY="PLAYBOOK_V3";

function load(){return JSON.parse(localStorage.getItem(KEY)||"[]")}
function save(d){localStorage.setItem(KEY,JSON.stringify(d))}

function buildCombo(t){
  let tools=[];
  if(t.tags.includes("Sweep")) tools.push("Sweep");
  if(t.tags.includes("BOS")) tools.push("BOS");
  if(t.tags.includes("FVG")) tools.push("FVG");
  if(t.tags.includes("OB")) tools.push("OB");
  if(t.tags.includes("EMA")) tools.push("EMA");
  if(!t.tags.includes("Sweep")) tools.unshift("No Sweep");
  tools.unshift(t.grade);

  let r="";
  if(t.note.includes("หลุด")) r="หลุดเทรนด์";
  else if(t.note.includes("สวน")) r="สวนเทรนด์";
  else if(t.note.includes("FOMO")) r="FOMO";
  else if(t.note.includes("ตาม")) r="ตามแผน";

  return r ? tools.join(" + ")+" | "+r : tools.join(" + ");
}

function saveTrade(){
  if(!note.value.trim()){alert("ต้องใส่หมายเหตุ");return}
  const tags=[...document.querySelectorAll("input[type=checkbox]:checked")].map(x=>x.value);
  const d=load();
  d.push({
    date:new Date().toISOString().slice(0,10),
    session:session.value,
    grade:grade.value,
    result:result.value,
    tags,
    note:note.value.trim()
  });
  save(d);
  document.querySelectorAll("input[type=checkbox]").forEach(x=>x.checked=false);
  note.value="";
  render();
}

function render(){
  const d=load();
  if(!d.length){
    summary.innerHTML="ยังไม่มีข้อมูล";
    combo.innerHTML="";
    return;
  }
  const win=d.filter(x=>x.result==="Win").length;
  summary.innerHTML=`🔥 Win ${win} | Loss ${d.length-win} | WinRate ${(win/d.length*100).toFixed(1)}%`;

  const map={};
  d.forEach(t=>{
    const k=buildCombo(t);
    if(!map[k]) map[k]={w:0,l:0};
    t.result==="Win"?map[k].w++:map[k].l++;
  });

  let h="<h3>Top Combo</h3><table><tr><th>Combo</th><th>Win%</th><th>W/L</th></tr>";
  Object.entries(map).sort((a,b)=>{
    return (b[1].w/(b[1].w+b[1].l))-(a[1].w/(a[1].w+a[1].l))
  }).forEach(([k,v])=>{
    const t=v.w+v.l;
    h+=`<tr><td>${k}</td><td>${(v.w/t*100).toFixed(1)}%</td><td>${v.w}/${v.l}</td></tr>`;
  });
  h+="</table>";
  combo.innerHTML=h;
}
render();
</script>

</body>
</html>
