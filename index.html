<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Backtest Playbook v5.1 PRO</title>
<style>
body{background:#0b0b0b;color:#eee;font-family:Arial,Helvetica,sans-serif;padding:14px}
h2,h3{margin:10px 0}
.card{background:#141414;border:1px solid #2a2a2a;border-radius:10px;padding:12px;margin-bottom:12px}
select,textarea,button{
  width:100%;margin-top:6px;padding:8px;
  background:#0f0f0f;color:#eee;border:1px solid #333;border-radius:6px
}
label{margin-right:10px;display:inline-block}
button.main{background:#22c55e;color:#000;font-weight:bold}
table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}
th,td{border:1px solid #333;padding:6px}
th{background:#222}
.warn{background:#5b1d1d;color:#ff6b6b}
.ok{background:#1f4f2f;color:#7CFC98}
</style>
</head>

<body>

<h2>📘 Backtest Playbook v5.1 PRO</h2>

<!-- ================= INPUT ================= -->
<div class="card">
<h3>Session / Grade / Result</h3>
<select id="session">
  <option>Asia</option><option>London</option><option>New York</option>
</select>
<select id="grade">
  <option>A+</option><option>A</option><option>B+</option><option>B</option>
</select>
<select id="result">
  <option>Win</option><option>Loss</option>
</select>
</div>

<div class="card">
<h3>Structure / Pattern</h3>
<label><input type="checkbox" value="Sweep"> Sweep</label>
<label><input type="checkbox" value="BOS"> BOS</label>
<label><input type="checkbox" value="FVG"> FVG</label>
<label><input type="checkbox" value="BullEng"> Bullish Engulfing</label>
<label><input type="checkbox" value="BearEng"> Bearish Engulfing</label>
<label><input type="checkbox" value="EMA_H1"> EMA200 H1</label>
<label><input type="checkbox" value="EMA_M15"> EMA200 M15</label>
</div>

<div class="card">
<h3>📝 หมายเหตุ (บังคับ)</h3>
<textarea id="note" placeholder="ตามแผน / หลุดเทรนด์ / สวนเทรนด์ / FOMO / อื่นๆ"></textarea>
</div>

<button class="main" onclick="saveTrade()">บันทึกไม้</button>

<!-- ================= OUTPUT ================= -->
<div class="card" id="summary"></div>
<div class="card" id="combo"></div>

<script>
const KEY="PLAYBOOK_V51";

/* ---------- STORAGE ---------- */
function load(){return JSON.parse(localStorage.getItem(KEY)||"[]")}
function save(d){localStorage.setItem(KEY,JSON.stringify(d))}

/* ---------- SAVE ---------- */
function saveTrade(){
  if(!note.value.trim()){
    alert("ต้องใส่หมายเหตุทุกไม้");
    return;
  }
  const tags=[...document.querySelectorAll("input[type=checkbox]:checked")]
              .map(x=>x.value);

  const data=load();
  data.push({
    grade:grade.value,
    result:result.value,
    tags,
    note:note.value.trim()
  });
  save(data);

  document.querySelectorAll("input[type=checkbox]").forEach(x=>x.checked=false);
  note.value="";
  render();
}

/* ---------- BUILD COMBO (Sweep ซ้ายสุด) ---------- */
function buildCombo(t){
  let arr=[];
  arr.push(t.tags.includes("Sweep") ? "Sweep" : "No Sweep");
  if(t.tags.includes("BOS")) arr.push("BOS");
  if(t.tags.includes("FVG")) arr.push("FVG");
  if(t.tags.includes("BullEng")) arr.push("BullEng");
  if(t.tags.includes("BearEng")) arr.push("BearEng");
  if(t.tags.includes("EMA_H1")) arr.push("EMA_H1");
  if(t.tags.includes("EMA_M15")) arr.push("EMA_M15");
  arr.unshift(t.grade);
  return arr.join(" + ") + " | " + t.note;
}

/* ---------- RENDER ---------- */
function render(){
  const d=load();
  if(!d.length){
    summary.innerHTML="ยังไม่มีข้อมูล";
    combo.innerHTML="";
    return;
  }

  const win=d.filter(x=>x.result==="Win").length;
  summary.innerHTML=`🔥 Win ${win} | Loss ${d.length-win} | WinRate ${(win/d.length*100).toFixed(1)}%`;

  const map={};
  d.forEach(t=>{
    const k=buildCombo(t);
    if(!map[k]) map[k]={w:0,l:0};
    t.result==="Win"?map[k].w++:map[k].l++;
  });

  let h="<h3>🔥 Top Combo (รวมหมายเหตุ)</h3>";
  h+="<table><tr><th>Combo</th><th>Win%</th><th>W/L</th></tr>";
  Object.entries(map).forEach(([k,v])=>{
    const tot=v.w+v.l;
    const wr=v.w/tot;
    h+=`<tr class="${wr<0.5?'warn':'ok'}">
          <td>${k}</td>
          <td>${(wr*100).toFixed(1)}%</td>
          <td>${v.w}/${v.l}</td>
        </tr>`;
  });
  h+="</table>";
  combo.innerHTML=h;
}

render();
</script>

</body>
</html>
