
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backtest Final Pro+</title>
<style>
body{background:#0b0b0b;color:#eee;font-family:sans-serif;margin:0;padding:16px}
h1,h3{color:#6cff7a}
.box{border:1px solid #222;border-radius:10px;padding:12px;margin-bottom:12px}
select,button{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:none}
button.save{background:#3fb950;color:#000;font-weight:bold}
button.clear{background:#e5533d;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
table{width:100%;border-collapse:collapse}
td,th{border-bottom:1px solid #333;padding:6px;text-align:center}
.small{color:#aaa;font-size:13px}
</style>
</head>
<body>

<h1>📊 Backtest Final Pro+</h1>

<div class="box">
<label>Session</label>
<select id="session">
<option>Asia</option><option>London</option><option>New York</option>
</select>

<label>Grade</label>
<select id="grade">
<option>A+</option><option>A</option><option>B</option><option>C</option>
</select>

<label>ผลลัพธ์</label>
<select id="result">
<option>Win</option><option>Loss</option>
</select>

<label>STO M5</label>
<select id="sto_m5">
<option>OVS</option><option>OVB</option><option>Mid</option>
</select>

<label>STO M15</label>
<select id="sto_m15">
<option>OVS</option><option>OVB</option><option>Mid</option>
</select>

<div class="grid">
<label><input type="checkbox" value="Trendline"> หลุด Trendline</label>
<label><input type="checkbox" value="Premium"> Premium</label>
<label><input type="checkbox" value="Discount"> Discount</label>
<label><input type="checkbox" value="EMA200_M5"> EMA200 เทรนเดียวกับ M5</label>
<label><input type="checkbox" value="EMA200_H1"> EMA200 เทรนเดียวกับ H1</label>
<label><input type="checkbox" value="FiboKey"> ฟิโบระยะสำคัญ</label>
<label><input type="checkbox" value="Sweep"> Sweep</label>
<label><input type="checkbox" value="Confirm"> Confirm</label>
</div>

<button class="save" onclick="saveTrade()">บันทึกไม้</button>
</div>

<div class="box">
<button onclick="setView('day')">📅 รายวัน</button>
<button onclick="setView('week')">📊 รายสัปดาห์</button>
<button onclick="setView('month')">📆 รายเดือน</button>
</div>

<div class="box">
<h3 id="title">สรุปรายวัน</h3>
<div id="summary"></div>
</div>

<div class="box">
<h3>🔥 Top 5 Combo (จาก checkbox จริง)</h3>
<div id="top5"></div>
</div>

<div class="box">
<h3>🔀 Session × Grade</h3>
<div id="matrix"></div>
</div>

<button class="clear" onclick="clearAll()">🗑️ ล้างข้อมูลทั้งหมด</button>

<script>
const STORE_KEY='backtest_final_pro_plus';
let view='day';

function getData(){return JSON.parse(localStorage.getItem(STORE_KEY)||'[]');}

function saveTrade(){
 const checks=[...document.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value);
 const data=getData();
 data.push({
  d:new Date().toISOString().slice(0,10),
  session:session.value,
  grade:grade.value,
  result:result.value,
  sto_m5:sto_m5.value,
  sto_m15:sto_m15.value,
  combo:[...checks, 'STO_M5_'+sto_m5.value, 'STO_M15_'+sto_m15.value].sort().join('+')
 });
 localStorage.setItem(STORE_KEY,JSON.stringify(data));
 render();
}

function clearAll(){
 if(confirm('ล้างข้อมูลทั้งหมด?')){
  localStorage.removeItem(STORE_KEY);
  render();
 }
}

function setView(v){view=v; render();}

function filterByView(data){
 const now=new Date();
 if(view==='day'){
  const d=now.toISOString().slice(0,10);
  return data.filter(x=>x.d===d);
 }
 if(view==='week'){
  return data.filter(x=>{
   const diff=(now-new Date(x.d))/(1000*60*60*24);
   return diff>=0 && diff<7;
  });
 }
 if(view==='month'){
  return data.filter(x=>{
   const dd=new Date(x.d);
   return dd.getMonth()===now.getMonth() && dd.getFullYear()===now.getFullYear();
  });
 }
 return data;
}

function render(){
 const all=getData();
 const data=filterByView(all);
 const w=data.filter(x=>x.result==='Win').length;
 const l=data.filter(x=>x.result==='Loss').length;
 const wr=w+l?((w/(w+l))*100).toFixed(1):0;
 title.innerText = view==='day'?'สรุปรายวัน':view==='week'?'สรุปรายสัปดาห์':'สรุปรายเดือน';
 summary.innerHTML = `Win: ${w} | Loss: ${l} | WinRate: ${wr}%`;

 // Top 5
 const map={};
 data.forEach(x=>{
  if(!map[x.combo]) map[x.combo]={w:0,l:0};
  x.result==='Win'?map[x.combo].w++:map[x.combo].l++;
 });
 const arr=Object.entries(map)
  .map(([k,v])=>({k,wr:(v.w+v.l)?v.w/(v.w+v.l):0}))
  .sort((a,b)=>b.wr-a.wr)
  .slice(0,5);

 top5.innerHTML='<table><tr><th>Combo</th><th>WinRate</th></tr>'+
 arr.map(x=>`<tr><td>${x.k}</td><td>${(x.wr*100).toFixed(1)}%</td></tr>`).join('')+'</table>';

 // Matrix
 const m={};
 data.forEach(x=>{
  const k=x.session+'-'+x.grade;
  if(!m[k]) m[k]={w:0,l:0};
  x.result==='Win'?m[k].w++:m[k].l++;
 });
 matrix.innerHTML='<table><tr><th>Session</th><th>Grade</th><th>WinRate</th></tr>'+
 Object.entries(m).map(([k,v])=>{
  const [s,g]=k.split('-');
  const wr=v.w+v.l?((v.w/(v.w+v.l))*100).toFixed(1):0;
  return `<tr><td>${s}</td><td>${g}</td><td>${wr}%</td></tr>`;
 }).join('')+'</table>';
}

render();
</script>

</body>
</html>
